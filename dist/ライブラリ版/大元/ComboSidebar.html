<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GASクイック</title>
<style>
  :root {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --border: #b8bcc4;
    --border-soft: #d5d9e0;
    --text: #000000;
    --muted: #000000;
    --accent: #1d4ed8;
    --accent-hover: #1e40af;
    --accent-soft: #e8f0fe;
    --btn-bg: #ffffff;
    --btn-hover: #eef2f7;
    --btn-active: #dfe6f0;
    --ok: #15803d;
    --err: #b91c1c;
    --warn: #92400e;
    --font-ui: "BIZ UDPGothic", "Meiryo", "Yu Gothic UI", sans-serif;
    --font-mono: "BIZ UDGothic", "Meiryo", "Consolas", monospace;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #000000;
    font-family: var(--font-ui);
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.35;
  }

  button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    color: #000000;
  }

  ::placeholder {
    color: #5f6368;
    opacity: 1;
  }

  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    padding: 3px;
    gap: 5px;
    overflow: hidden;
  }

  /* ---- 共通ボタン・入力 ---- */
  .btn {
    border: 1px solid var(--border);
    background: var(--btn-bg);
    color: #000000;
    border-radius: 3px;
    padding: 4px 6px;
    cursor: pointer;
    font-size: 11.2px;
    font-weight: 500;
    line-height: 1.25;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    user-select: none;
    transition: background-color 0.08s ease;
  }
  .btn:hover:not(:disabled) {
    background: var(--btn-hover);
  }
  .btn:active:not(:disabled) {
    background: var(--btn-active);
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: default;
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent-hover);
    color: #ffffff;
    text-shadow: none;
    font-weight: 700;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }
  .btn-hero {
    width: 100%;
    padding: 6px 4px;
    font-size: 11.7px;
    font-weight: 700;
    background: var(--accent-soft);
    border-color: #7aa7e8;
    color: #000000;
    margin-bottom: 5px;
  }
  .btn-hero:hover:not(:disabled) {
    background: #dbeafe;
  }

  /* ---- 上部入力エリア ---- */
  .top-input {
    display: flex;
    gap: 5px;
    align-items: stretch;
    flex-shrink: 0;
  }
  .ask-textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    height: 58px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--panel);
    color: #000000;
    font-size: 13.5px;
    line-height: 1.4;
    outline: none;
  }
  .ask-textarea:focus {
    border-color: var(--accent);
  }
  .top-btns {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 66px;
    flex-shrink: 0;
  }
  .btn-run {
    flex: 1;
    font-size: 12.2px;
    padding: 4px 2px;
  }
  .btn-clear {
    padding: 3px 2px;
    font-size: 10.7px;
  }

  /* ---- オプション行 ---- */
  .option-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 3px 6px;
    flex-shrink: 0;
    font-size: 12px;
    color: #000000;
  }
  .chk-label {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    color: #000000;
  }
  .chk-label input {
    margin: 0;
    cursor: pointer;
  }
  .status-label {
    margin-left: auto;
    font-size: 12px;
    font-weight: 700;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .status-label.busy {
    color: var(--accent);
  }

  /* ---- 対象 / シートバー ---- */
  .target-bar {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    background: #e9ecf1;
    border: 1px solid var(--border-soft);
    border-radius: 3px;
    padding: 3px 4px;
  }
  .target-name {
    max-width: 76px;
    font-size: 12.5px;
    font-weight: 700;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  .sheet-select {
    flex: 1;
    min-width: 0;
    height: 24px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--panel);
    color: #000000;
    font-size: 12.5px;
    padding: 0 2px;
  }
  .target-bar .btn {
    padding: 3px 5px;
    font-size: 10.7px;
    flex-shrink: 0;
  }

  /* ---- タブバー ---- */
  .tabs-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .tab-bar {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
    flex-shrink: 0;
    margin-bottom: -1px;
    z-index: 1;
  }
  .tab-btn {
    border: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: #f4f5f7;
    border-radius: 3px 3px 0 0;
    padding: 2px 2px; line-height: 1.2;
    font-size: 11.2px;
    font-weight: 500;
    color: #000000;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
  }
  .tab-btn:hover {
    background: #eef1f5;
  }
  .tab-btn.active {
    background: var(--panel);
    border-bottom-color: var(--panel);
    font-weight: 700;
    color: #000000;
  }

  .tab-body {
    flex: 1;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: 0 0 3px 3px;
    background: var(--panel);
    padding: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tab-pane {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .tab-pane.active {
    display: flex;
  }

  /* ---- 自動タブ ---- */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-bottom: 6px;
  }
  .quick-grid .btn {
    padding: 5px 2px;
    font-size: 11.2px;
    color: #000000;
  }
  .auto-status-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 2px;
    border-top: 1px solid var(--border-soft);
    padding-top: 5px;
  }
  .status-line {
    font-size: 12.5px;
    line-height: 1.35;
    color: #000000;
    word-break: break-word;
    overflow-wrap: anywhere;
    padding: 3px 5px;
    border-radius: 2px;
    background: #f8f9fb;
    border-left: 3px solid #cbd5e1;
  }
  .status-line.preview-hit {
    background: #eff6ff;
    border-left-color: var(--accent);
    color: #0b3b8c;
    font-weight: 600;
  }
  .status-line.preview-miss {
    background: #fffbeb;
    border-left-color: #d97706;
    color: var(--warn);
  }
  .status-line.info-line {
    color: #000000;
    white-space: pre-line;
  }

  /* ---- 会話・経過ログタブ ---- */
  .log-box {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    border: 1px solid var(--border-soft);
    background: #fafafa;
    border-radius: 2px;
    padding: 4px;
    color: #000000;
    font-family: var(--font-ui);
    font-weight: 500;
    font-size: 12.5px;
    line-height: 1.4;
  }
  .log-entry {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    padding-bottom: 5px;
    margin-bottom: 5px;
    border-bottom: 1px dashed #9ca3af;
  }
  .log-entry:last-child {
    margin-bottom: 0;
  }
  .log-entry.is-ok .log-head {
    color: var(--ok);
    font-weight: 700;
  }
  .log-entry.is-err .log-head {
    color: var(--err);
    font-weight: 700;
  }
  .log-entry.is-info .log-head {
    color: var(--accent);
    font-weight: 700;
  }
  .log-empty {
    color: #000000;
    font-size: 12.5px;
    padding: 6px;
    text-align: center;
  }
  .pane-footer {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    margin-top: 5px;
    flex-shrink: 0;
  }

  /* ---- 履歴タブ ---- */
  .hist-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    border: 1px solid var(--border-soft);
    border-radius: 2px;
    background: #ffffff;
  }
  .hist-item {
    padding: 5px 6px;
    font-size: 13px;
    color: #000000;
    border-bottom: 1px solid #eef0f4;
    cursor: pointer;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .hist-item:hover {
    background: #f3f6fb;
  }
  .hist-item.selected {
    background: #dbeafe;
    font-weight: 600;
  }

  /* ---- 一覧タブ（GASクイック） ---- */
  #pane-list { overflow: hidden; }
  .quick-filter-bar { display: flex; gap: 2px; margin-bottom: 4px; flex-shrink: 0; }
  .quick-filter-btn { flex: 1; padding: 2px 3px; font-size: 10.7px; border: 1px solid var(--border); border-radius: 3px; background: #f4f5f7; color: #000000; cursor: pointer; text-align: center; white-space: nowrap; }
  .quick-filter-btn:hover { background: #e8eef6; }
  .quick-filter-btn.active { background: var(--accent); border-color: var(--accent-hover); color: #ffffff; text-shadow: none; font-weight: 700; }
  .quick-move { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  .quick-move button { font-size: 10px; line-height: 1; padding: 1px 4px; border: 1px solid var(--border); border-radius: 2px; background: #fff; cursor: pointer; }
  .quick-move button:disabled { opacity: .35; cursor: default; }
  .quick-move button.is-pinned { color: #b45309; border-color: #f59e0b; background: #fffbeb; }
  .quick-pin-mark { flex-shrink: 0; font-size: 11px; color: #d97706; }
  .quick-item { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; user-select: none; -webkit-user-select: none; }
  .quick-label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .quick-tag { flex-shrink: 0; font-size: 11px; padding: 0 4px; border-radius: 2px; background: #eef0f4; color: #000000; font-weight: 500; }
  .quick-tag.t-sheet { background: #fef3c7; color: #78350f; }
  .quick-tag.t-my { background: #dcfce7; color: #14532d; }
  .quick-tag.t-shelf { background: #e0e7ff; color: #312e81; }
  .quick-bolt { flex-shrink: 0; font-size: 11px; color: #d97706; }
  .quick-desc { font-size: 11px; color: #000000; font-weight: 500; }
  .quick-note { font-size: 11px; color: #000000; margin-top: 4px; }
  .hist-row { display: flex; align-items: flex-start; gap: 5px; }
  .hist-row input[type="checkbox"] { margin: 2px 0 0 0; flex-shrink: 0; cursor: pointer; }
  .hist-row-txt { flex: 1; min-width: 0; }

  /* ---- 設定タブ ---- */
  .conf-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 7px;
  }
  .conf-label {
    font-size: 12.5px;
    font-weight: 700;
    color: #000000;
  }
  .conf-control {
    width: 100%;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2px 5px;
    background: #ffffff;
    color: #000000;
    font-size: 13px;
  }
  .conf-actions {
    display: flex;
    gap: 4px;
    margin-top: 2px;
  }
  .conf-actions .btn {
    flex: 1;
    padding: 5px 4px;
  }
  .conf-note {
    font-size: 12px;
    color: #000000;
    word-break: break-word;
    background: #f8f9fb;
    border: 1px solid var(--border-soft);
    border-radius: 2px;
    padding: 4px 5px;
    white-space: pre-line;
  }

  /* ---- インライン手順保存バー ---- */
  .save-steps-bar {
    margin-top: 5px;
    padding: 5px;
    border: 1px solid #93c5fd;
    border-radius: 3px;
    background: #eff6ff;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .save-steps-info {
    font-size: 11px;
    color: #1e3a8a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .save-steps-row {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .save-steps-input {
    flex: 1;
    min-width: 0;
    height: 24px;
    padding: 2px 5px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: #ffffff;
    font-size: 12px;
  }

  /* ---- 下部固定バー ---- */
  .bottom-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    flex-shrink: 0;
  }
  .bottom-bar .btn {
    padding: 5px 2px;
    font-size: 10.7px;
    font-weight: 500;
    color: #000000;
  }
  .bottom-bar .btn.btn-undo-ready {
    border-color: #2563eb;
    background: #eff6ff;
    color: #1e40af;
    font-weight: 700;
  }
  .bottom-bar .btn.btn-undo-ready:hover:not(:disabled) {
    background: #dbeafe;
  }
</style>
</head>
<body>
<div class="app">
  <!-- 上部入力欄 -->
  <div class="top-input">
    <textarea id="askInput" class="ask-textarea" rows="3" placeholder="頼みを入力（例: 見出しを太字に）"></textarea>
    <div class="top-btns">
      <button id="btnRun" class="btn btn-primary btn-run" type="button">実 行</button>
      <button id="btnClear" class="btn btn-clear" type="button">クリア(×)</button>
    </div>
  </div>

  <!-- オプション行 -->
  <div class="option-row">
    <label class="chk-label"><input type="checkbox" id="chkOk">確認なし</label>
    <label class="chk-label"><input type="checkbox" id="chkBackup">控え</label>
    <label class="chk-label"><input type="checkbox" id="chkSync" checked>連動</label>
    <span id="statusLabel" class="status-label">表示中: 自動</span>
  </div>

  <!-- 対象 / シートバー -->
  <div class="target-bar">
    <span id="targetNameLabel" class="target-name" title="対象スプレッドシート">読込中…</span>
    <select id="sheetSelect" class="sheet-select" title="シート切替"></select>
    <button id="btnLook" class="btn" type="button" title="今のシートの表情報を読み直す">読込</button>
  </div>

  <!-- 6タブ -->
  <div class="tabs-wrap">
    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" type="button" data-tab="auto">自動</button>
      <button class="tab-btn" type="button" data-tab="list">一覧</button>
      <button class="tab-btn" type="button" data-tab="chat">会話</button>
      <button class="tab-btn" type="button" data-tab="hist">履歴</button>
      <button class="tab-btn" type="button" data-tab="trace">経過</button>
      <button class="tab-btn" type="button" data-tab="conf">設定</button>
    </div>

    <div class="tab-body">
      <!-- 一覧タブ（GASクイック: このシートのマクロ・マイマクロ・棚） -->
      <div id="pane-list" class="tab-pane">
        <div id="quickFilterBar" class="quick-filter-bar">
          <button class="quick-filter-btn active" type="button" data-qfilter="all">すべて</button>
          <button class="quick-filter-btn" type="button" data-qfilter="pin">★</button>
          <button class="quick-filter-btn" type="button" data-qfilter="sheet">シート</button>
          <button class="quick-filter-btn" type="button" data-qfilter="my">マイ</button>
          <button class="quick-filter-btn" type="button" data-qfilter="shelf">棚</button>
        </div>
        <div id="quickList" class="hist-list">
          <div class="log-empty">読込中…</div>
        </div>
        <div class="pane-footer">
          <button id="btnQuickRun" class="btn btn-primary" type="button">実行</button>
          <button id="btnQuickAdd" class="btn" type="button" title="チャット AI 等で作った新しい関数を貼り付けて追加">＋追加</button>
          <button id="btnQuickEdit" class="btn" type="button">編集</button>
          <button id="btnQuickImport" class="btn" type="button">マイマクロへ</button>
          <button id="btnQuickReload" class="btn" type="button">更新</button>
        </div>
        <div id="quickNote" class="quick-note"></div>
      </div>

      <!-- 自動タブ -->
      <div id="pane-auto" class="tab-pane active">
        <div id="autoSheetPanel">
          <button id="btnSeiri" class="btn btn-hero" type="button">【一発整形】データ整理 ＋ 表を整える</button>
          <div class="quick-grid">
            <button class="btn" type="button" data-op='[{"shelf":"total"}]'>合計行</button>
            <button class="btn" type="button" data-action="autoWidth">列幅自動</button>
            <button class="btn" type="button" data-op='[{"shelf":"dedupe"}]'>重複削除</button>
            <button class="btn" type="button" data-action="freezeHeader">見出し固定</button>
            <button class="btn" type="button" data-op='[{"shelf":"unfreeze"}]'>固定解除</button>
            <button class="btn" type="button" data-op='[{"shelf":"filter.on"}]'>フィルタ</button>
            <button class="btn" type="button" data-op='[{"shelf":"banding.add","theme":"blue"}]'>交互の色</button>
            <button class="btn" type="button" data-op='[{"shelf":"banding.remove"}]'>交互解除</button>
            <button class="btn" type="button" data-op='[{"shelf":"filter.off"}]'>フィルタ解除</button>
          </div>
        </div>

        <!-- 3行ステータス -->
        <div class="auto-status-box">
          <div id="selLabel" class="status-line">選択中: 待機中…</div>
          <div id="previewLabel" class="status-line">自動判定: 待機中</div>
          <div id="infoLabel" class="status-line info-line">対象: 読込中…</div>
        </div>
      </div>

      <!-- 会話タブ -->
      <div id="pane-chat" class="tab-pane">
        <div id="chatLog" class="log-box">
          <div class="log-empty">実行結果がここに表示されます。</div>
        </div>
        <div class="pane-footer">
          <button id="btnAgain" class="btn" type="button">もう一度</button>
          <button id="btnGoChanged" class="btn" type="button">直した所</button>
          <button id="btnCopyLog" class="btn" type="button">会話をコピー</button>
          <button id="btnClearLog" class="btn" type="button">会話消去</button>
        </div>
      </div>

      <!-- 履歴タブ -->
      <div id="pane-hist" class="tab-pane">
        <div id="histList" class="hist-list">
          <div class="log-empty">実行した指示の履歴はまだありません。</div>
        </div>
        <div id="saveStepsBar" class="save-steps-bar" style="display:none;">
          <div id="saveStepsInfo" class="save-steps-info"></div>
          <div class="save-steps-row">
            <input id="saveStepsName" class="save-steps-input" type="text" placeholder="手順マクロ名を入力">
            <button id="btnSaveStepsOk" class="btn btn-primary" type="button">保存</button>
            <button id="btnSaveStepsCancel" class="btn" type="button">やめる</button>
          </div>
        </div>
        <div class="pane-footer">
          <button id="btnUseHist" class="btn" type="button">入力欄へ</button>
          <button id="btnSaveSteps" class="btn" type="button" title="チェックした履歴（または選択中の履歴）を⚡手順マクロとしてマイマクロへ保存">⚡手順化</button>
          <button id="btnRerunHist" class="btn btn-primary" type="button">再実行</button>
        </div>
      </div>

      <!-- 経過タブ -->
      <div id="pane-trace" class="tab-pane">
        <div id="traceLog" class="log-box">
          <div class="log-empty">実行時間の内訳がここに記録されます。</div>
        </div>
      </div>

      <!-- 設定タブ -->
      <div id="pane-conf" class="tab-pane">
        <div id="settingsEngineBox" class="conf-group" style="display:none;">
          <label class="conf-label">大元セットアップ（初回接続用）</label>
          <div id="settingsEngineIdLabel" class="conf-note" style="margin-bottom:6px;word-break:break-all;">大元ID: -</div>
          <div style="display:flex;gap:6px;">
            <button id="btnCopyConnectorJson" class="btn btn-primary" type="button" style="flex:1;">つなぎ用 JSON をコピー</button>
            <button id="btnCopyEngineId" class="btn" type="button">IDコピー</button>
          </div>
          <div id="settingsEngineStatus" class="conf-note" style="margin-top:4px;">テンプレートの appsscript.json にそのまま貼り付けて保存してください。</div>
        </div>
        <div id="settingsNewBookBox" class="conf-group">
          <label class="conf-label" for="settingsNewBookName">新規ファイルを作成（GASクイック入り）</label>

  function isClearColor(val) {

  function parseColorToRgbObj(val) {

    var hex = DIRECT_COLOR_MAP[s] || DIRECT_COLOR_MAP[s.toLowerCase()];
    if (!hex) {
      var norm = s.replace(/^薄い/, "薄").replace(/色$/, "");
      hex = DIRECT_COLOR_MAP[norm] || DIRECT_COLOR_MAP[s.replace(/^薄い/, "薄")];
    }
    if (!hex && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(s)) {
      hex = s.length === 4 ? ("#" + s[1] + s[1] + s[2] + s[2] + s[3] + s[3]) : s;

    var r = parseInt(hex.slice(1, 3), 16) / 255;

  function colToNum0(colStr) {
    var s = String(colStr || "").trim().toUpperCase();

    for (var i = 0; i < s.length; i++) {
      var code = s.charCodeAt(i);
      if (code < 65 || code > 90) return -1;
      n = n * 26 + (code - 64);

  }

  function num0ToCol(n0) {

      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function parseSimpleA1Range(a1Str, sheetId) {
    var s = String(a1Str || "").trim().toUpperCase();
    if (!s || s.indexOf("!") >= 0) return null;
    var m = s.match(/^([A-Z]{1,3})([0-9]{1,6})(?::([A-Z]{1,3})([0-9]{1,6}))?$/);
    if (!m) return null;
    var c1 = colToNum0(m[1]);
    var r1 = parseInt(m[2], 10) - 1;
    var c2 = m[3] ? colToNum0(m[3]) : c1;
    var r2 = m[4] ? (parseInt(m[4], 10) - 1) : r1;
    if (c1 < 0 || c2 < c1 || r1 < 0 || r2 < r1) return null;
    var canon = (r1 === r2 && c1 === c2) ? (m[1] + (r1 + 1)) : (m[1] + (r1 + 1) + ":" + (m[3] || m[1]) + (r2 + 1));

      gridRange: {
        sheetId: sheetId,
        startRowIndex: r1,
        endRowIndex: r2 + 1,
        startColumnIndex: c1,
        endColumnIndex: c2 + 1

      a1: canon,
      r1: r1, r2: r2, c1: c1, c2: c2

  function resolveColLetterFromTable(colRef) {

    var mCol = ref.match(/^([A-Za-z]{1,3})列$/);
    if (mCol) return mCol[1].toUpperCase();
    var cols = (state.table && Array.isArray(state.table.columns)) ? state.table.columns : [];
    for (var i = 0; i < cols.length; i++) {
      if (cols[i] && (cols[i].name === ref || cols[i].col === ref.toUpperCase())) {
        return cols[i].col;
      }
    }
    return "";
  }

  function getSnapshotDims(sheetName) {
    var maxR = 30, maxC = 26;
    var dims = state.sheetDimsMap && state.sheetDimsMap[sheetName];
    if (dims) {
      if (dims.rows > maxR) maxR = dims.rows;
      if (dims.cols > maxC) maxC = dims.cols;
    }
    var tb = state.table;
    if (tb && (!state.curSheet || state.curSheet === sheetName)) {
      if (tb.total_row && Number(tb.total_row) > maxR) maxR = Number(tb.total_row);
      if (tb.data) {
        var dm = String(tb.data).match(/-([0-9]+)$/);
        if (dm && parseInt(dm[1], 10) > maxR) maxR = parseInt(dm[1], 10);
      }
      if (tb.last_col) {
        var lcN = colToNum0(tb.last_col) + 1;
        if (lcN > maxC) maxC = lcN;
      }

    maxR = Math.min(200, Math.max(30, maxR));
    maxC = Math.min(40, Math.max(26, maxC));

    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id) +
      "?ranges=" + encodeURIComponent(qName) +
      "&fields=sheets(properties(sheetId,title,gridProperties(frozenRowCount,frozenColumnCount,hideGridlines)),bandedRanges(bandedRangeId),data(rowData(values(userEnteredFormat,userEnteredValue,effectiveValue(errorValue)))))";

  function inferNumberFormatType(pattern) {

      } else if (op.shelf === "clear.format" || op.shelf === "clear.values" || op.shelf === "clear.all") {

        }
        changed.push(sheetName + "!" + wKeys.slice(0, 3).join(",") + (wKeys.length > 3 ? "…" : "") + " 書き込み");
        whatList.push("write");
      } else if (op.shelf === "filter.off") {
        requests.push({ clearBasicFilter: { sheetId: sheetId } });
        canUndo = false;
        changed.push(sheetName + " フィルター解除");
        whatList.push("filter.off");
      } else if (op.shelf === "filter.on") {
        var fA1 = op.range ? String(op.range) : resolveTableRangeStr(true);
        var fRg = parseSimpleA1Range(fA1, sheetId);
        if (!fRg) return null;
        requests.push({ setBasicFilter: { filter: { range: fRg.gridRange } } });
        undoRequests.unshift({ clearBasicFilter: { sheetId: sheetId } });
        changed.push(sheetName + "!" + fRg.a1 + " フィルター設定");
        whatList.push("filter.on");
      } else if (op.shelf === "sort") {
        if (op.where || op.filter || (op.cols && op.cols.length) || !op.col) return null;
        var sortColLetter = resolveColLetterFromTable(op.col);
        var sortColIdx = colToNum0(sortColLetter);
        if (sortColIdx < 0) return null;
        var sA1 = op.range ? String(op.range) : resolveTableRangeStr(false);
        var sRg = parseSimpleA1Range(sA1, sheetId);
        if (!sRg) return null;
        requests.push({
          sortRange: {
            range: sRg.gridRange,
            sortSpecs: [{ dimensionIndex: sortColIdx, sortOrder: op.desc ? "DESCENDING" : "ASCENDING" }]
          }
        });
        canUndo = false;
        snapshotMutators.push(function() { prefetchSheetSnapshot(sheetName); });
        changed.push(sheetName + "!" + sRg.a1 + " " + op.col + "列で" + (op.desc ? "降順" : "昇順") + "並べ替え");
        whatList.push("sort");
      } else if (op.shelf === "banding.add" || op.shelf === "banding.remove") {
        var bSnap = state.sheetSnapshot[sheetName];
        if (!bSnap || !Array.isArray(bSnap.bandedRangeIds)) return null;
        var oldBandIds = bSnap.bandedRangeIds.slice();
        if (op.shelf === "banding.remove" && !oldBandIds.length) return null;
        for (var bdi = 0; bdi < oldBandIds.length; bdi++) {
          requests.push({ deleteBanding: { bandedRangeId: oldBandIds[bdi] } });
        }
        if (op.shelf === "banding.add") {
          var bA1 = op.range ? String(op.range) : resolveTableRangeStr(true);
          var bRg = parseSimpleA1Range(bA1, sheetId);
          if (!bRg) return null;
          var themeKey = String(op.theme || "gray").toLowerCase();
          var pal = BANDING_THEMES[themeKey] || BANDING_THEMES.gray;
          var addReqIdx = requests.length;
          requests.push({
            addBanding: {
              bandedRange: {
                range: bRg.gridRange,
                rowProperties: {
                  headerColorStyle: { rgbColor: parseColorToRgbObj(pal.header) },
                  firstBandColorStyle: { rgbColor: parseColorToRgbObj(pal.first) },
                  secondBandColorStyle: { rgbColor: parseColorToRgbObj(pal.second) }
                }
              }
            }
          });
          if (oldBandIds.length === 0) {
            (function(rIdx, sName) {
              postUndoBuilders.push(function(resJson, outUndo) {
                if (resJson && Array.isArray(resJson.replies) && resJson.replies[rIdx] &&
                    resJson.replies[rIdx].addBanding && resJson.replies[rIdx].addBanding.bandedRange) {
                  var bid = resJson.replies[rIdx].addBanding.bandedRange.bandedRangeId;
                  outUndo.unshift({ deleteBanding: { bandedRangeId: bid } });
                }
              });
              undoSnapshotMutators.push(function() {
                if (state.sheetSnapshot[sName]) state.sheetSnapshot[sName].bandedRangeIds = [];
              });
            })(addReqIdx, sheetName);
          } else {
            canUndo = false;
          }
          (function(rIdx, sName) {
            snapshotMutators.push(function(resJson) {
              var sp = state.sheetSnapshot[sName];
              if (!sp) return;
              var newIds = [];
              if (resJson && Array.isArray(resJson.replies) && resJson.replies[rIdx] &&
                  resJson.replies[rIdx].addBanding && resJson.replies[rIdx].addBanding.bandedRange) {
                newIds.push(resJson.replies[rIdx].addBanding.bandedRange.bandedRangeId);
              }
              sp.bandedRangeIds = newIds;
            });
          })(addReqIdx, sheetName);
          changed.push(sheetName + "!" + bRg.a1 + " 交互背景色(" + themeKey + ")");
        } else {
          canUndo = false;
          (function(sName) {
            snapshotMutators.push(function() {
              if (state.sheetSnapshot[sName]) state.sheetSnapshot[sName].bandedRangeIds = [];
            });
          })(sheetName);
          changed.push(sheetName + " 交互背景色解除");
        }
        whatList.push(op.shelf);
      } else if (op.shelf === "sheet.color") {
        var tcName = op.name || sheetName;
        var tcSid = state.sheetIdMap[tcName];
        if (typeof tcSid !== "number") return null;
        var isClearTab = (op.color === undefined || op.color === null || op.color === "" || isClearColor(op.color));
        var tabStyle = null;
        if (!isClearTab) {
          var tcRgb = parseColorToRgbObj(op.color);
          if (!tcRgb) return null;
          tabStyle = { rgbColor: tcRgb };
        }
        requests.push({
          updateSheetProperties: {
            properties: { sheetId: tcSid, tabColorStyle: tabStyle },
            fields: "tabColorStyle"
          }
        });
        canUndo = false;
        changed.push(tcName + " タブ色" + (isClearTab ? "解除" : "変更"));
        whatList.push("sheet.color");
      } else if (op.shelf === "sheet.rename") {
        if (!op.to) return null;
        var rnOld = op.name || sheetName;
        var rnNew = String(op.to).trim();
        var rnSid = state.sheetIdMap[rnOld];
        if (!rnNew || typeof rnSid !== "number") return null;
        requests.push({
          updateSheetProperties: {
            properties: { sheetId: rnSid, title: rnNew },
            fields: "title"
          }
        });
        undoRequests.unshift({
          updateSheetProperties: {
            properties: { sheetId: rnSid, title: rnOld },
            fields: "title"
          }
        });
        (function(oName, nName, sid) {
          snapshotMutators.push(function() {
            delete state.sheetIdMap[oName];
            state.sheetIdMap[nName] = sid;
            if (state.sheetDimsMap[oName]) { state.sheetDimsMap[nName] = state.sheetDimsMap[oName]; delete state.sheetDimsMap[oName]; }
            if (Array.isArray(state.sheets)) {
              for (var si = 0; si < state.sheets.length; si++) {
                if (state.sheets[si] === oName) state.sheets[si] = nName;
              }
            }
            if (state.curSheet === oName) state.curSheet = nName;
            if (state.target && state.target.sheet === oName) state.target.sheet = nName;
            if (state.sheetSnapshot[oName]) {
              state.sheetSnapshot[nName] = state.sheetSnapshot[oName];
              delete state.sheetSnapshot[oName];
            }
            syncSheetSelects();
            updateInfoLabel();
            updateSelectionLabel();
          });
          undoSnapshotMutators.push(function() {
            delete state.sheetIdMap[nName];
            state.sheetIdMap[oName] = sid;
            if (state.sheetDimsMap[nName]) { state.sheetDimsMap[oName] = state.sheetDimsMap[nName]; delete state.sheetDimsMap[nName]; }
            if (Array.isArray(state.sheets)) {
              for (var si = 0; si < state.sheets.length; si++) {
                if (state.sheets[si] === nName) state.sheets[si] = oName;
              }
            }
            if (state.curSheet === nName) state.curSheet = oName;
            if (state.target && state.target.sheet === nName) state.target.sheet = oName;
            if (state.sheetSnapshot[nName]) {
              state.sheetSnapshot[oName] = state.sheetSnapshot[nName];
              delete state.sheetSnapshot[nName];
            }
            syncSheetSelects();
            updateInfoLabel();
            updateSelectionLabel();
          });
        })(rnOld, rnNew, rnSid);
        changed.push(rnOld + " → " + rnNew + " シート名変更");
        whatList.push("sheet.rename");
      } else if (op.shelf === "sheet.hide") {
        var hName = op.name || sheetName;
        var hSid = state.sheetIdMap[hName];
        if (typeof hSid !== "number" || !Array.isArray(state.sheets) || state.sheets.length <= 1) return null;
        requests.push({
          updateSheetProperties: {
            properties: { sheetId: hSid, hidden: true },
            fields: "hidden"
          }
        });
        undoRequests.unshift({
          updateSheetProperties: {
            properties: { sheetId: hSid, hidden: false },
            fields: "hidden"
          }
        });
        changed.push(hName + " 非表示");
        whatList.push("sheet.hide");
      } else if (op.shelf === "sheet.show") {
        if (!op.name) return null;
        var shSid = state.sheetIdMap[op.name];
        if (typeof shSid !== "number") return null;
        requests.push({
          updateSheetProperties: {
            properties: { sheetId: shSid, hidden: false },
            fields: "hidden"
          }
        });
        undoRequests.unshift({
          updateSheetProperties: {
            properties: { sheetId: shSid, hidden: true },
            fields: "hidden"
          }
        });
        changed.push(op.name + " 再表示");
        whatList.push("sheet.show");
      } else if (op.shelf === "sheet.gridlines") {
        if (op.all_sheets) return null;
        var snapG = state.sheetSnapshot[sheetName];
        if (op.show === undefined && !snapG) return null;
        var prevHideG = snapG ? !!snapG.hideGridlines : false;
        var nextHideG = (op.show === undefined) ? !prevHideG : !op.show;
        requests.push({
          updateSheetProperties: {
            properties: { sheetId: sheetId, gridProperties: { hideGridlines: nextHideG } },
            fields: "gridProperties.hideGridlines"
          }
        });
        if (snapG) {
          undoRequests.unshift({
            updateSheetProperties: {
              properties: { sheetId: sheetId, gridProperties: { hideGridlines: prevHideG } },
              fields: "gridProperties.hideGridlines"
            }
          });
          (function(sName, nHide, oHide) {
            snapshotMutators.push(function() {
              var sp = state.sheetSnapshot[sName];
              if (sp) sp.hideGridlines = nHide;
            });
            undoSnapshotMutators.push(function() {
              var sp = state.sheetSnapshot[sName];
              if (sp) sp.hideGridlines = oHide;
            });
          })(sheetName, nextHideG, prevHideG);
        } else {
          canUndo = false;
        }
        changed.push(sheetName + " 枠線" + (nextHideG ? "非表示" : "表示"));
        whatList.push("sheet.gridlines");
      } else if (op.shelf === "rows.hide" || op.shelf === "rows.show") {
        var rRaw = Array.isArray(op.rows) ? op.rows : (op.rows !== undefined ? [op.rows] : []);
        if (!rRaw.length) return null;
        var rSeen = {}, rNums = [];
        for (var rhi = 0; rhi < rRaw.length; rhi++) {
          var rn = parseInt(rRaw[rhi], 10);
          if (!rn || rn < 1) return null;
          if (!rSeen[rn]) { rSeen[rn] = 1; rNums.push(rn); }
        }
        if (!rNums.length) return null;
        rNums.sort(function(a, b) { return a - b; });
        var isHideR = op.shelf === "rows.hide";
        for (var rIdx0 = 0; rIdx0 < rNums.length; ) {
          var rStart = rNums[rIdx0], rEnd = rStart;
          while (rIdx0 + 1 < rNums.length && rNums[rIdx0 + 1] === rEnd + 1) rEnd = rNums[++rIdx0];
          requests.push({
            updateDimensionProperties: {
              range: { sheetId: sheetId, dimension: "ROWS", startIndex: rStart - 1, endIndex: rEnd },
              properties: { hiddenByUser: isHideR },
              fields: "hiddenByUser"
            }
          });
          undoRequests.unshift({
            updateDimensionProperties: {
              range: { sheetId: sheetId, dimension: "ROWS", startIndex: rStart - 1, endIndex: rEnd },
              properties: { hiddenByUser: !isHideR },
              fields: "hiddenByUser"
            }
          });
          rIdx0++;
        }
        changed.push(sheetName + "!" + rNums.join("・") + "行目 " + (isHideR ? "非表示" : "再表示"));
        whatList.push(op.shelf);
      } else if (op.shelf === "cols.hide" || op.shelf === "cols.show") {
        var cRaw = Array.isArray(op.cols) ? op.cols : (op.cols !== undefined ? [op.cols] : []);
        if (!cRaw.length) return null;
        var cSeen = {}, cNums = [];
        for (var chi2 = 0; chi2 < cRaw.length; chi2++) {
          var cLet = typeof cRaw[chi2] === "number" ? num0ToCol(cRaw[chi2] - 1) : resolveColLetterFromTable(cRaw[chi2]);
          var c0Idx = colToNum0(cLet);
          if (c0Idx < 0) return null;
          if (!cSeen[c0Idx]) { cSeen[c0Idx] = 1; cNums.push(c0Idx); }
        }
        if (!cNums.length) return null;
        cNums.sort(function(a, b) { return a - b; });
        var isHideC = op.shelf === "cols.hide";
        for (var cIdx0 = 0; cIdx0 < cNums.length; ) {
          var cStart = cNums[cIdx0], cEnd = cStart;
          while (cIdx0 + 1 < cNums.length && cNums[cIdx0 + 1] === cEnd + 1) cEnd = cNums[++cIdx0];
          requests.push({
            updateDimensionProperties: {
              range: { sheetId: sheetId, dimension: "COLUMNS", startIndex: cStart, endIndex: cEnd + 1 },
              properties: { hiddenByUser: isHideC },
              fields: "hiddenByUser"
            }
          });
          undoRequests.unshift({
            updateDimensionProperties: {
              range: { sheetId: sheetId, dimension: "COLUMNS", startIndex: cStart, endIndex: cEnd + 1 },
              properties: { hiddenByUser: !isHideC },
              fields: "hiddenByUser"
            }
          });
          cIdx0++;
        }
        changed.push(sheetName + "!" + cRaw.join("・") + "列 " + (isHideC ? "非表示" : "再表示"));
        whatList.push(op.shelf);
      } else if (op.shelf === "note.set" || op.shelf === "note.clear") {
        if (!op.range) return null;
        if (op.shelf === "note.set" && (op.text === undefined || op.text === null || op.text === "")) return null;
        var noteRg = parseSimpleA1Range(String(op.range), sheetId);
        if (!noteRg) return null;
        requests.push({
          repeatCell: {
            range: noteRg.gridRange,
            cell: op.shelf === "note.set" ? { note: String(op.text) } : {},
            fields: "note"
          }
        });
        canUndo = false;
        changed.push(sheetName + "!" + noteRg.a1 + (op.shelf === "note.set" ? " メモ設定" : " メモ消去"));
        whatList.push(op.shelf);
      } else if (op.shelf === "validation.clear") {
        if (!op.range) return null;
        var vcRg = parseSimpleA1Range(String(op.range), sheetId);
        if (!vcRg) return null;
        requests.push({ setDataValidation: { range: vcRg.gridRange } });
        canUndo = false;
        changed.push(sheetName + "!" + vcRg.a1 + " 入力規則解除");
        whatList.push("validation.clear");
      } else if (op.shelf === "api") {
        if (!els.chkOk || !els.chkOk.checked) return null;
        if (!Array.isArray(op.requests) || !op.requests.length) return null;
        for (var apiIdx = 0; apiIdx < op.requests.length; apiIdx++) {
          requests.push(op.requests[apiIdx]);
        }
        canUndo = false;
        changed.push(sheetName + " API直接操作(" + op.requests.length + "件)");
        whatList.push("api");
      } else {
        return null;
      }
    }

    if (!requests.length) return null;
    return {
      requests: requests,
      undoRequests: undoRequests,
      canUndo: canUndo,
      finalizeUndo: function(resJson) {
        if (!canUndo) return [];
        var out = undoRequests.slice();
        for (var pb = 0; pb < postUndoBuilders.length; pb++) {
          postUndoBuilders[pb](resJson, out);
        }
        return out;
      },
      changed: changed,
      what: whatList.join("・"),
      applySnapshot: function(resJson) {
        for (var m = 0; m < snapshotMutators.length; m++) snapshotMutators[m](resJson);
      },
      restoreSnapshot: function() {
        for (var u = undoSnapshotMutators.length - 1; u >= 0; u--) undoSnapshotMutators[u]();
      }
    };
  }

  function tryDirectSheetsApi(ops, label, isFromAsk, fallbackFn, retried, opts) {
    if (typeof fetch !== "function") return false;
    var switchChat = !(opts && opts.switchToChat === false);
    var sheetName = state.curSheet || (state.target && state.target.sheet) || "";
    var plan = buildDirectBatchUpdate(ops, sheetName);
    if (!plan) {
      // 直結の道に乗れなかった理由が写しの失敗なら、会話の欄に 1 回だけ出す（黙って遅い道に回らない）
      if (state.prefetchError && !state.prefetchErrorShown) {
        state.prefetchErrorShown = true;
        appendLog(els.chatLog, "is-err", "⚠ 直結の道（0.3 秒）が使えません", state.prefetchError + "（GAS の道で撃ちます）");
      }
      return false;
    }

    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return true;
    }
    setBusy(true, "実行中…");
    if (switchChat) switchTab("chat");

    var t0 = performance.now();
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id) + ":batchUpdate";
    fetch(url, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.oauthToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ requests: plan.requests })
    })
      .then(function(res) {
        if (!res.ok) {
          var e = new Error("HTTP " + res.status);
          e.status = res.status;
          throw e;
        }
        return res.json();
      })
      .then(function(resJson) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        plan.applySnapshot(resJson);
        var finalUndoReqs = plan.finalizeUndo(resJson);
        if (plan.canUndo && finalUndoReqs.length) {
          state.directUndoStack.push({
            sheet: state.curSheet || sheetName,
            what: plan.what || "format",
            requests: finalUndoReqs,
            restoreSnapshot: plan.restoreSnapshot
          });
          updateUndoBtnState(true, plan.what);
        } else {
          state.directUndoStack = [];
          updateUndoBtnState(false);
        }
        var lines = [];
        if (isFromAsk) {
          lines.push("[棚ヒット] " + formatOpsShort(ops));
        }
        lines.push("対象: " + (state.target.name || "(名前なし)") + " › " + (state.curSheet || sheetName));
        lines.push("直した所: " + plan.changed.slice(0, 2).join(" ／ "));
        lines.push((plan.canUndo && finalUndoReqs.length) ? "直接控えあり（直前を取り消す で戻せます）" : "控えなし（取り消し不可・Ctrl+Z 推奨）");
        checkNewErrorsAfterDirect(state.curSheet || sheetName, ops, function(news) {
          if (news.length) lines.push("⚠ 新しいエラー: " + news.slice(0, 5).join("・") + (news.length > 5 ? " ほか " + (news.length - 5) + " 件" : "") + "（直前を取り消すで戻せます）");
          recordExecution(true, label, lines.join("\n"), wallMs, 0, switchChat, true);
        });
        if (!switchChat) {
          var noteHead = (plan.changed && plan.changed.length)
            ? (label + ": " + plan.changed.slice(0, 3).join(" / ") + (plan.changed.length > 3 ? " …" : ""))
            : (label + " を実行しました");
          els.quickNote.textContent = noteHead + "（" + (Math.max(0, wallMs / 1000)).toFixed(2) + "s・直接API）";
        }
        if (state.oauthTokenAt && (Date.now() - state.oauthTokenAt > 3000000)) {
          setTimeout(function() { quickCheckBuild(true); }, 0);
        }
      })
      .catch(function(err) {
        if (err && err.status === 401 && !retried && hasGasBridge()) {
          callGas("comboQuickBuild", {}, function(rb) {
            setBusy(false);
            if (rb && rb.oauthToken) {
              state.oauthToken = rb.oauthToken;
              state.oauthTokenAt = Date.now();
              tryDirectSheetsApi(ops, label, isFromAsk, fallbackFn, true, opts);
            } else if (fallbackFn) {
              fallbackFn();
            }
          }, function() {
            setBusy(false);
            if (fallbackFn) fallbackFn();
          });
          return;
        }
        setBusy(false);
        if (fallbackFn) fallbackFn();
      });
    return true;
  }

  function tryDirectUndo(fallbackFn, retried, retryItem) {
    if (typeof fetch !== "function" || !state.oauthToken || !state.target.id || (!retryItem && !state.directUndoStack.length)) {
      return false;
    }
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return true;
    }
    var item = retryItem || state.directUndoStack.pop();
    setBusy(true, "取り消し中…");
    switchTab("chat");

    var t0 = performance.now();
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id) + ":batchUpdate";
    fetch(url, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.oauthToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ requests: item.requests })
    })
      .then(function(res) {
        if (!res.ok) {
          var e = new Error("HTTP " + res.status);
          e.status = res.status;
          throw e;
        }
        return res.json();
      })
      .then(function() {
        var wallMs = performance.now() - t0;
        setBusy(false);
        if (item.restoreSnapshot) item.restoreSnapshot();
        updateUndoBtnState(false);
        var body = [
          "対象: " + (state.target.name || "(名前なし)") + " › " + item.sheet,
          "戻した: " + item.what + " を取り消しました（直接API戻し）"
        ].join("\n");
        recordExecution(true, "直前を取り消す", body, wallMs, 0, true, true);
      })
      .catch(function(err) {
        if (err && err.status === 401 && !retried && hasGasBridge()) {
          callGas("comboQuickBuild", {}, function(rb) {
            setBusy(false);
            if (rb && rb.oauthToken) {
              state.oauthToken = rb.oauthToken;
              state.oauthTokenAt = Date.now();
              tryDirectUndo(fallbackFn, true, item);
            } else if (fallbackFn) {
              fallbackFn();
            }
          }, function() {
            setBusy(false);
            if (fallbackFn) fallbackFn();
          });
          return;
        }
        setBusy(false);
        if (fallbackFn) fallbackFn();
      });
    return true;
  }

  // ---- アクション実行 ----
  function runServerAction(opts) {
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return;
    }
    var switchChat = opts.switchToChat !== false;
    setBusy(true, opts.statusText || "実行中…");
    if (switchChat) switchTab("chat");

    var t0 = performance.now();
    callGas(
      opts.fnName,
      opts.payload,
      function(res) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        setTimeout(function() { quickCheckBuild(false); }, 0);

        if (!res || res.ok === false) {
          var errMsg = (res && (res.text || res.error)) || "実行に失敗しました";
          if (res && res.needs_ok && errMsg.indexOf("確認なし") === -1) {
            errMsg += "\n（「確認なし」にチェックを入れて再実行してください）";
          }
          recordExecution(false, opts.label, errMsg, wallMs, res && res.gasMs, true);
          return;
        }

        if (opts.onSuccess) opts.onSuccess(res, wallMs);
        applyServerState(res);
        if (opts.fnName === "comboUndo") {
          updateUndoBtnState(false);
        } else if (opts.fnName === "comboRunOps" || opts.fnName === "comboRunAsk" || opts.fnName === "comboQuickRun") {
          var canBack = !!(res.backup || res.fastUndo || res.snapped);
          updateUndoBtnState(canBack, res.backup ? ("控え #" + res.backup) : (canBack ? "控えあり" : ""));
        }

        if (!opts.silentSuccess) {
          recordExecution(true, opts.label, res.text || "完了", wallMs, res.gasMs, switchChat);
        }
      },
      function(err) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        recordExecution(false, opts.label, formatError(err), wallMs, undefined, true);
      }
    );
  }

  function onInit(silent, forceQuick) {
    runServerAction({
      fnName: "comboInit",
      payload: {
        targetId: state.target.id || "",
        sheet: state.curSheet || "",
        assumeActive: true,
        includeQuick: true,
        forceQuick: !!forceQuick
      },
      label: "初期化 / 再読込",
      statusText: "読込中…",
      switchToChat: false,
      silentSuccess: !!silent,
      onSuccess: function(res) {
        updateEngineSetupUI(res && res.engineScriptId);
        if (!res || !res.learned) loadLearned();

    });
  }

  function onLook(sheetOverride) {

    runServerAction({
      fnName: "comboLook",
