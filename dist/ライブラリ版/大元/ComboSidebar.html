<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GASクイック</title>
<style>
  :root {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --border: #b8bcc4;
    --border-soft: #d5d9e0;
    --text: #000000;
    --muted: #000000;
    --accent: #1d4ed8;
    --accent-hover: #1e40af;
    --accent-soft: #e8f0fe;
    --btn-bg: #ffffff;
    --btn-hover: #eef2f7;
    --btn-active: #dfe6f0;
    --ok: #15803d;
    --err: #b91c1c;
    --warn: #92400e;
    --font-ui: "Meiryo", "Yu Gothic UI", "BIZ UDPGothic", sans-serif;
    --font-mono: "BIZ UDGothic", "Meiryo", "Consolas", monospace;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #000000;
    font-family: var(--font-ui);
    font-size: 13.5px;
    line-height: 1.35;
  }

  button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    color: #000000;
  }

  ::placeholder {
    color: #333333;
    opacity: 1;
  }

  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    padding: 6px;
    gap: 5px;
    overflow: hidden;
  }

  /* ---- 共通ボタン・入力 ---- */
  .btn {
    border: 1px solid var(--border);
    background: var(--btn-bg);
    color: #333333;
    border-radius: 3px;
    padding: 4px 6px;
    cursor: pointer;
    font-size: 11.2px;
    font-weight: 600;
    line-height: 1.25;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    user-select: none;
    transition: background-color 0.08s ease;
  }
  .btn:hover:not(:disabled) {
    background: var(--btn-hover);
  }
  .btn:active:not(:disabled) {
    background: var(--btn-active);
  }
  .btn:disabled {
    opacity: 0.55;
    cursor: default;
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent-hover);
    color: #ffffff;
    font-weight: 700;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }
  .btn-hero {
    width: 100%;
    padding: 6px 4px;
    font-size: 11.7px;
    font-weight: 700;
    background: var(--accent-soft);
    border-color: #7aa7e8;
    color: #333333;
    margin-bottom: 5px;
  }
  .btn-hero:hover:not(:disabled) {
    background: #dbeafe;
  }

  /* ---- 上部入力エリア ---- */
  .top-input {
    display: flex;
    gap: 5px;
    align-items: stretch;
    flex-shrink: 0;
  }
  .ask-textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    height: 58px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--panel);
    color: #000000;
    font-size: 13.5px;
    line-height: 1.4;
    outline: none;
  }
  .ask-textarea:focus {
    border-color: var(--accent);
  }
  .top-btns {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 66px;
    flex-shrink: 0;
  }
  .btn-run {
    flex: 1;
    font-size: 12.2px;
    padding: 4px 2px;
  }
  .btn-clear {
    padding: 3px 2px;
    font-size: 10.7px;
  }

  /* ---- オプション行 ---- */
  .option-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 3px 6px;
    flex-shrink: 0;
    font-size: 12px;
    color: #000000;
  }
  .chk-label {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    color: #000000;
  }
  .chk-label input {
    margin: 0;
    cursor: pointer;
  }
  .status-label {
    margin-left: auto;
    font-size: 12px;
    font-weight: 700;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .status-label.busy {
    color: var(--accent);
  }

  /* ---- 対象 / シートバー ---- */
  .target-bar {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    background: #e9ecf1;
    border: 1px solid var(--border-soft);
    border-radius: 3px;
    padding: 3px 4px;
  }
  .target-name {
    max-width: 76px;
    font-size: 12.5px;
    font-weight: 700;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  .sheet-select {
    flex: 1;
    min-width: 0;
    height: 24px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--panel);
    color: #000000;
    font-size: 12.5px;
    padding: 0 2px;
  }
  .target-bar .btn {
    padding: 3px 5px;
    font-size: 10.7px;
    flex-shrink: 0;
  }

  /* ---- タブバー ---- */
  .tabs-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .tab-bar {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
    flex-shrink: 0;
    margin-bottom: -1px;
    z-index: 1;
  }
  .tab-btn {
    border: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: #e4e7ec;
    border-radius: 3px 3px 0 0;
    padding: 2px 2px; line-height: 1.2;
    font-size: 11.2px;
    font-weight: 600;
    color: #000000;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
  }
  .tab-btn:hover {
    background: #eef1f5;
  }
  .tab-btn.active {
    background: var(--panel);
    border-bottom-color: var(--panel);
    font-weight: 700;
    color: #000000;
  }

  .tab-body {
    flex: 1;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: 0 0 3px 3px;
    background: var(--panel);
    padding: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tab-pane {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .tab-pane.active {
    display: flex;
  }

  /* ---- 自動タブ ---- */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-bottom: 6px;
  }
  .quick-grid .btn {
    padding: 5px 2px;
    font-size: 11.2px;
    color: #333333;
  }
  .auto-status-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 2px;
    border-top: 1px solid var(--border-soft);
    padding-top: 5px;
  }
  .status-line {
    font-size: 12.5px;
    line-height: 1.35;
    color: #000000;
    word-break: break-word;
    overflow-wrap: anywhere;
    padding: 3px 5px;
    border-radius: 2px;
    background: #f8f9fb;
    border-left: 3px solid #cbd5e1;
  }
  .status-line.preview-hit {
    background: #eff6ff;
    border-left-color: var(--accent);
    color: #0b3b8c;
    font-weight: 600;
  }
  .status-line.preview-miss {
    background: #fffbeb;
    border-left-color: #d97706;
    color: var(--warn);
  }
  .status-line.info-line {
    color: #000000;
    white-space: pre-line;
  }

  /* ---- 会話・経過ログタブ ---- */
  .log-box {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    border: 1px solid var(--border-soft);
    background: #fafafa;
    border-radius: 2px;
    padding: 5px;
    color: #000000;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.4;
  }
  .log-entry {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    padding-bottom: 5px;
    margin-bottom: 5px;
    border-bottom: 1px dashed #9ca3af;
  }
  .log-entry:last-child {
    margin-bottom: 0;
  }
  .log-entry.is-ok .log-head {
    color: var(--ok);
    font-weight: 700;
  }
  .log-entry.is-err .log-head {
    color: var(--err);
    font-weight: 700;
  }
  .log-entry.is-info .log-head {
    color: var(--accent);
    font-weight: 700;
  }
  .log-empty {
    color: #000000;
    font-size: 12.5px;
    padding: 6px;
    text-align: center;
  }
  .pane-footer {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    margin-top: 5px;
    flex-shrink: 0;
  }

  /* ---- 履歴タブ ---- */
  .hist-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    border: 1px solid var(--border-soft);
    border-radius: 2px;
    background: #ffffff;
  }
  .hist-item {
    padding: 5px 6px;
    font-size: 13px;
    color: #000000;
    border-bottom: 1px solid #eef0f4;
    cursor: pointer;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .hist-item:hover {
    background: #f3f6fb;
  }
  .hist-item.selected {
    background: #dbeafe;
    font-weight: 600;
  }

  /* ---- 一覧タブ（GASクイック） ---- */
  #pane-list { overflow: hidden; }
  .quick-move { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  .quick-move button { font-size: 10px; line-height: 1; padding: 1px 4px; border: 1px solid var(--border); border-radius: 2px; background: #fff; cursor: pointer; }
  .quick-move button:disabled { opacity: .35; cursor: default; }
  .quick-item { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; user-select: none; -webkit-user-select: none; }
  .quick-label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .quick-tag { flex-shrink: 0; font-size: 11px; padding: 0 4px; border-radius: 2px; background: #eef0f4; color: #374151; font-weight: 400; }
  .quick-tag.t-sheet { background: #fef3c7; color: #78350f; }
  .quick-tag.t-my { background: #dcfce7; color: #14532d; }
  .quick-tag.t-shelf { background: #e0e7ff; color: #312e81; }
  .quick-desc { font-size: 11px; color: #6b7280; font-weight: 400; }
  .quick-note { font-size: 11px; color: #6b7280; margin-top: 4px; }

  /* ---- 設定タブ ---- */
  .conf-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 7px;
  }
  .conf-label {
    font-size: 12.5px;
    font-weight: 700;
    color: #000000;
  }
  .conf-control {
    width: 100%;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 2px 5px;
    background: #ffffff;
    color: #000000;
    font-size: 13px;
  }
  .conf-actions {
    display: flex;
    gap: 4px;
    margin-top: 2px;
  }
  .conf-actions .btn {
    flex: 1;
    padding: 5px 4px;
  }
  .conf-note {
    font-size: 12px;
    color: #000000;
    word-break: break-word;
    background: #f8f9fb;
    border: 1px solid var(--border-soft);
    border-radius: 2px;
    padding: 4px 5px;
    white-space: pre-line;
  }

  /* ---- 下部固定バー ---- */
  .bottom-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    flex-shrink: 0;
  }
  .bottom-bar .btn {
    padding: 5px 2px;
    font-size: 10.7px;
    font-weight: 700;
    color: #333333;
  }
</style>
</head>
<body>
<div class="app">
  <!-- 上部入力欄 -->
  <div class="top-input">
    <textarea id="askInput" class="ask-textarea" rows="3" placeholder="頼みを入力（例: 見出しを太字に）するか、下の一覧から選ぶ"></textarea>
    <div class="top-btns">
      <button id="btnRun" class="btn btn-primary btn-run" type="button">実 行</button>
      <button id="btnClear" class="btn btn-clear" type="button">クリア(×)</button>
    </div>
  </div>

  <!-- オプション行 -->
  <div class="option-row">
    <label class="chk-label"><input type="checkbox" id="chkOk">確認なし</label>
    <label class="chk-label"><input type="checkbox" id="chkBackup">控え</label>
    <label class="chk-label" style="display:none"><input type="checkbox" id="chkAiAuto">AI自動</label>
    <label class="chk-label"><input type="checkbox" id="chkSync" checked>連動</label>
    <span id="statusLabel" class="status-label">表示中: 自動</span>
  </div>

  <!-- 対象 / シートバー -->
  <div class="target-bar">
    <span id="targetNameLabel" class="target-name" title="対象スプレッドシート">読込中…</span>
    <select id="sheetSelect" class="sheet-select" title="シート切替"></select>
    <button id="btnLook" class="btn" type="button">読込</button>
    <button id="btnRefresh" class="btn" type="button">更新</button>
  </div>

  <!-- 5タブ -->
  <div class="tabs-wrap">
    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" type="button" data-tab="list">一覧</button>
      <button class="tab-btn" type="button" data-tab="auto">自動</button>
      <button class="tab-btn" type="button" data-tab="chat">会話</button>
      <button class="tab-btn" type="button" data-tab="hist">履歴</button>
      <button class="tab-btn" type="button" data-tab="trace">経過</button>
      <button class="tab-btn" type="button" data-tab="conf">設定</button>
    </div>

    <div class="tab-body">
      <!-- 一覧タブ（GASクイック: このシートのマクロ・マイマクロ・棚） -->
      <div id="pane-list" class="tab-pane active">
        <div id="quickList" class="hist-list">
          <div class="log-empty">読込中…</div>
        </div>
        <div class="pane-footer">
          <button id="btnQuickRun" class="btn btn-primary" type="button">実行</button>
          <button id="btnQuickEdit" class="btn" type="button">編集</button>
          <button id="btnQuickImport" class="btn" type="button">マイマクロへ</button>
          <button id="btnQuickReload" class="btn" type="button">更新</button>
        </div>
        <div id="quickNote" class="quick-note"></div>
      </div>

      <!-- 自動タブ -->
      <div id="pane-auto" class="tab-pane">
        <!-- Sheetモード -->
        <div id="autoSheetPanel">
          <button id="btnSeiri" class="btn btn-hero" type="button">【一発整形】データ整理 ＋ 表を整える</button>
          <div class="quick-grid">
            <button class="btn" type="button" data-action="look">読込</button>
            <button class="btn" type="button" data-action="undo">戻す</button>
            <button class="btn" type="button" data-op='[{"shelf":"total"}]'>合計行</button>
            <button class="btn" type="button" data-action="autoWidth">列幅自動</button>
            <button class="btn" type="button" data-action="freezeHeader">見出し固定</button>
            <button class="btn" type="button" data-op='[{"shelf":"unfreeze"}]'>固定解除</button>
            <button class="btn" type="button" data-op='[{"shelf":"dedupe"}]'>重複削除</button>
            <button class="btn" type="button" data-op='[{"shelf":"banding.add","theme":"blue"}]'>交互の色</button>
            <button class="btn" type="button" data-op='[{"shelf":"banding.remove"}]'>交互解除</button>
          </div>
        </div>

        <!-- Docモード -->
        <div id="autoDocPanel" style="display:none;">
          <button id="btnDocStyle" class="btn btn-hero" type="button">【一発整形】文書の体裁を整える</button>
          <div class="quick-grid">
            <button class="btn" type="button" data-action="look">読込</button>
            <button class="btn" type="button" data-action="undo">戻す</button>
            <button class="btn" type="button" data-op='[{"shelf":"doc.outline"}]'>章立て確認</button>
            <button class="btn" type="button" data-op='[{"shelf":"doc.toc"}]'>目次挿入</button>
            <button class="btn" type="button" data-op='[{"shelf":"doc.header","page_number":true}]'>ページ番号</button>
            <button class="btn" type="button" data-op='[{"shelf":"doc.table.style"}]'>表の装飾</button>
            <button class="btn" type="button" data-op='[{"shelf":"doc.align","align":"left"}]'>左揃え</button>
            <button class="btn" type="button" data-op='[{"shelf":"doc.align","align":"center"}]'>中央揃え</button>
            <button class="btn" type="button" data-op='[{"shelf":"doc.align","line_spacing":1.5}]'>行間1.5</button>
            <button class="btn" type="button" data-op='[{"shelf":"doc.list","type":"bullet"}]'>箇条書き</button>
            <button class="btn" type="button" data-op='[{"shelf":"doc.list","type":"none"}]'>リスト解除</button>
            <button class="btn" type="button" data-action="findShelf">棚検索</button>
          </div>
        </div>

        <!-- 3行ステータス -->
        <div class="auto-status-box">
          <div id="selLabel" class="status-line">選択中: 待機中…</div>
          <div id="previewLabel" class="status-line">自動判定: 待機中</div>
          <div id="infoLabel" class="status-line info-line">対象: 読込中…</div>
        </div>
      </div>

      <!-- 会話タブ -->
      <div id="pane-chat" class="tab-pane">
        <div id="chatLog" class="log-box">
          <div class="log-empty">実行結果がここに表示されます。</div>
        </div>
        <div class="pane-footer">
          <button id="btnAgain" class="btn" type="button">もう一度</button>
          <button id="btnGoChanged" class="btn" type="button">直した所</button>
          <button id="btnCopyLog" class="btn" type="button">会話をコピー</button>
          <button id="btnClearLog" class="btn" type="button">会話消去</button>
        </div>
      </div>

      <!-- 履歴タブ -->
      <div id="pane-hist" class="tab-pane">
        <div id="histList" class="hist-list">
          <div class="log-empty">実行した指示の履歴はまだありません。</div>
        </div>
        <div class="pane-footer">
          <button id="btnUseHist" class="btn" type="button">入力欄へ</button>
          <button id="btnRerunHist" class="btn btn-primary" type="button">再実行</button>
        </div>
      </div>

      <!-- 経過タブ -->
      <div id="pane-trace" class="tab-pane">
        <div id="traceLog" class="log-box">
          <div class="log-empty">実行時間の内訳がここに記録されます。</div>
        </div>
      </div>

      <!-- 設定タブ -->
      <div id="pane-conf" class="tab-pane">
        <div class="conf-group">
          <label class="conf-label" for="settingsSheetSelect">シート切替</label>
          <select id="settingsSheetSelect" class="conf-control"></select>
        </div>
        <div class="conf-group">
          <div id="settingsInfoLabel" class="conf-note">対象: 未読込</div>
        </div>
        <div style="display:none">
        <div class="conf-group">
          <label class="conf-label" for="cfgAiMode">AI連携方式</label>
          <select id="cfgAiMode" class="conf-control">
            <option value="postbox">郵便受け (CLI連携)</option>
            <option value="api_gemini">Gemini API (鍵)</option>
            <option value="api_claude">Claude API (鍵)</option>
          </select>
        </div>
        <div class="conf-group">
          <label class="conf-label" for="cfgAiModel">AIモデル</label>
          <select id="cfgAiModel" class="conf-control">
            <option value="sonnet">ソネット (sonnet)</option>
            <option value="haiku">ハイク (haiku)</option>
            <option value="gemini-4-hydrogen-low">ハイド君 Low (gemini-4-hydrogen-low)</option>
            <option value="gemini-4-hydrogen-medium">ハイド君 Medium (gemini-4-hydrogen-medium)</option>
            <option value="gemini-4-hydrogen-high">ハイド君 High (gemini-4-hydrogen-high)</option>
          </select>
        </div>
        <div class="conf-group">
          <label class="conf-label" for="cfgApiKey">APIキー</label>
          <input id="cfgApiKey" class="conf-control" type="password" placeholder="APIキーを入力（変更時のみ）" autocomplete="off">
        </div>
        <div class="conf-actions">
          <button id="btnSaveConfig" class="btn btn-primary" type="button">設定を保存</button>
          <button id="btnCheckPostbox" class="btn" type="button">郵便受け確認</button>
        </div>
        <div id="postboxStatusLabel" class="conf-note" style="margin-top:6px;">郵便受け: 待機中</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 下部固定バー -->
  <div class="bottom-bar">
    <button id="btnNewTalk" class="btn" type="button" style="display:none">新しい話</button>
    <button id="btnUndo" class="btn" type="button">直前を取り消す</button>
    <button id="btnReload" class="btn" type="button">再読込</button>
  </div>
</div>

<script>

  // ---- 直接 Sheets API 高速実行エンジン（GAS起動ゼロ・0.4秒級） ----
  var DIRECT_COLOR_MAP = {
    "黒": "#000000", "black": "#000000", "白": "#FFFFFF", "white": "#FFFFFF",
    "赤": "#FF0000", "red": "#FF0000", "青": "#0000FF", "blue": "#0000FF",
    "緑": "#008000", "green": "#008000", "黄": "#FFFF00", "yellow": "#FFFF00",
    "橙": "#FFA500", "オレンジ": "#FFA500", "orange": "#FFA500",
    "紫": "#800080", "purple": "#800080", "桃": "#FFC0CB", "ピンク": "#FFC0CB", "pink": "#FFC0CB",
    "灰": "#808080", "灰色": "#808080", "グレー": "#808080", "gray": "#808080", "grey": "#808080",
    "水色": "#00FFFF", "シアン": "#00FFFF", "cyan": "#00FFFF", "lightblue": "#ADD8E6",
    "紺": "#000080", "ネイビー": "#000080", "navy": "#000080",
    "茶": "#8B4513", "茶色": "#8B4513", "brown": "#8B4513",
    "薄赤": "#FCE4D6", "薄青": "#D9E1F2", "薄緑": "#E2EFDA", "薄黄": "#FFF2CC",
    "薄灰": "#F2F2F2", "薄灰色": "#F2F2F2", "薄グレー": "#F2F2F2",
    "薄橙": "#FCE5CD", "薄紫": "#EAD1DC",
    "lightred": "#FCE4D6", "lightgreen": "#E2EFDA", "lightyellow": "#FFF2CC", "lightgray": "#F2F2F2"
  };

  function parseColorToRgbObj(val) {
    if (val === undefined || val === null || val === "") return null;
    var s = String(val).trim();
    if (s === "なし" || /^(none|transparent|clear)$/i.test(s)) {
      return { red: 1, green: 1, blue: 1 };
    }
    var hex = DIRECT_COLOR_MAP[s] || DIRECT_COLOR_MAP[s.toLowerCase()];
    if (!hex) {
      var norm = s.replace(/^薄い/, "薄").replace(/色$/, "");
      hex = DIRECT_COLOR_MAP[norm] || DIRECT_COLOR_MAP[s.replace(/^薄い/, "薄")];
    }
    if (!hex && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(s)) {
      hex = s.length === 4 ? ("#" + s[1] + s[1] + s[2] + s[2] + s[3] + s[3]) : s;
    }
    if (!hex) return null;
    var r = parseInt(hex.slice(1, 3), 16) / 255;
    var g = parseInt(hex.slice(3, 5), 16) / 255;
    var b = parseInt(hex.slice(5, 7), 16) / 255;
    return { red: r, green: g, blue: b };
  }

  function colToNum0(colStr) {
    var s = String(colStr || "").trim().toUpperCase();
    var n = 0;
    for (var i = 0; i < s.length; i++) {
      var code = s.charCodeAt(i);
      if (code < 65 || code > 90) return -1;
      n = n * 26 + (code - 64);
    }
    return n - 1;
  }

  function num0ToCol(n0) {
    var n = n0 + 1;
    var s = "";
    while (n > 0) {
      var m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function parseSimpleA1Range(a1Str, sheetId) {
    var s = String(a1Str || "").trim().toUpperCase();
    if (!s || s.indexOf("!") >= 0) return null;
    var m = s.match(/^([A-Z]{1,3})([0-9]{1,6})(?::([A-Z]{1,3})([0-9]{1,6}))?$/);
    if (!m) return null;
    var c1 = colToNum0(m[1]);
    var r1 = parseInt(m[2], 10) - 1;
    var c2 = m[3] ? colToNum0(m[3]) : c1;
    var r2 = m[4] ? (parseInt(m[4], 10) - 1) : r1;
    if (c1 < 0 || c2 < c1 || r1 < 0 || r2 < r1) return null;
    var canon = (r1 === r2 && c1 === c2) ? (m[1] + (r1 + 1)) : (m[1] + (r1 + 1) + ":" + (m[3] || m[1]) + (r2 + 1));
    return {
      gridRange: {
        sheetId: sheetId,
        startRowIndex: r1,
        endRowIndex: r2 + 1,
        startColumnIndex: c1,
        endColumnIndex: c2 + 1
      },
      a1: canon,
      r1: r1, r2: r2, c1: c1, c2: c2
    };
  }

  function resolveColLetterFromTable(colRef) {
    var ref = String(colRef || "").trim();
    if (!ref) return "";
    if (/^[A-Za-z]{1,3}$/.test(ref)) return ref.toUpperCase();
    var mCol = ref.match(/^([A-Za-z]{1,3})列$/);
    if (mCol) return mCol[1].toUpperCase();
    var cols = (state.table && Array.isArray(state.table.columns)) ? state.table.columns : [];
    for (var i = 0; i < cols.length; i++) {
      if (cols[i] && (cols[i].name === ref || cols[i].col === ref.toUpperCase())) {
        return cols[i].col;
      }
    }
    return "";
  }

  function prefetchSheetSnapshot(sheetName) {
    if (!state.oauthToken || !state.target.id || !sheetName || typeof fetch !== "function") return;
    var qName = "'" + String(sheetName).replace(/'/g, "''") + "'!A1:Z30";
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id) +
      "?ranges=" + encodeURIComponent(qName) +
      "&fields=sheets(properties(sheetId,title,gridProperties(frozenRowCount,frozenColumnCount)),bandedRanges(bandedRangeId),data(rowData(values(userEnteredFormat,userEnteredValue,effectiveValue(errorValue)))))";
    fetch(url, {
      method: "GET",
      headers: { "Authorization": "Bearer " + state.oauthToken }
    })
      .then(function(r) { if (!r.ok) throw new Error("Sheets API HTTP " + r.status); return r.json(); })
      .then(function(data) {
        if (!data || !Array.isArray(data.sheets) || !data.sheets[0]) return;
        var shObj = data.sheets[0];
        var props = shObj.properties || {};
        if (props.title && typeof props.sheetId === "number") {
          state.sheetIdMap[props.title] = props.sheetId;
        }
        var gp = props.gridProperties || {};
        var rowData = (shObj.data && shObj.data[0] && shObj.data[0].rowData) || [];
        var cells = [];
        for (var r = 0; r < 30; r++) {
          var rowVals = (rowData[r] && rowData[r].values) || [];
          var rowArr = [];
          for (var c = 0; c < 26; c++) {
            rowArr.push((rowVals[c] && rowVals[c].userEnteredFormat) ? JSON.parse(JSON.stringify(rowVals[c].userEnteredFormat)) : {});
          }
          cells.push(rowArr);
        }
        var bIds = [];
        if (Array.isArray(shObj.bandedRanges)) {
          for (var bi = 0; bi < shObj.bandedRanges.length; bi++) {
            if (shObj.bandedRanges[bi] && typeof shObj.bandedRanges[bi].bandedRangeId === "number") {
              bIds.push(shObj.bandedRanges[bi].bandedRangeId);
            }
          }
        }
        state.sheetSnapshot[sheetName] = {
          errs: errsOfRowData(rowData),
          vals: valsOfRowData(rowData),
          frozenRows: gp.frozenRowCount || 0,
          frozenCols: gp.frozenColumnCount || 0,
          bandedRangeIds: bIds,
          cells: cells
        };
        state.prefetchError = "";
      })
      .catch(function(err) { state.prefetchError = String((err && err.message) || err || "写しを取れません"); });
  }

  // 写しの範囲（A1:Z30）の中のエラーのセル { "A1": "#REF!" }
  var ERR_LABEL = { ERROR: "#ERROR!", NULL_VALUE: "#NULL!", DIVIDE_BY_ZERO: "#DIV/0!", VALUE: "#VALUE!", REF: "#REF!", NAME: "#NAME?", NUM: "#NUM!", N_A: "#N/A", LOADING: "" };
  // 写しの範囲の「書く前の値」 { "A1": userEnteredValue }（空のセルは入れない）
  function valsOfRowData(rowData) {
    var out = {};
    for (var r = 0; r < Math.min(rowData.length, 30); r++) {
      var vs = (rowData[r] && rowData[r].values) || [];
      for (var c = 0; c < Math.min(vs.length, 26); c++) {
        if (vs[c] && vs[c].userEnteredValue) out[num0ToCol(c) + (r + 1)] = vs[c].userEnteredValue;
      }
    }
    return out;
  }

  function errsOfRowData(rowData) {
    var out = {};
    for (var r = 0; r < Math.min(rowData.length, 30); r++) {
      var vs = (rowData[r] && rowData[r].values) || [];
      for (var c = 0; c < Math.min(vs.length, 26); c++) {
        var ev = vs[c] && vs[c].effectiveValue && vs[c].effectiveValue.errorValue;
        if (ev && ERR_LABEL[ev.type] !== "") out[num0ToCol(c) + (r + 1)] = ERR_LABEL[ev.type] || ("#" + ev.type);
      }
    }
    return out;
  }

  // 値を書く手を直結で撃った後、写しの範囲を読み直して、撃つ前に無かったエラーだけを返す（書式だけの手では読まない）
  function checkNewErrorsAfterDirect(sheetName, ops, done) {
    var writes = ops.some(function(o) { return /^(write|clear\.)/.test(String(o.shelf || "")); });
    var snap = state.sheetSnapshot[sheetName];
    if (!writes || !snap || !snap.errs || typeof fetch !== "function") { done([]); return; }
    var qName = "'" + String(sheetName).replace(/'/g, "''") + "'!A1:Z30";
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id) +
      "?ranges=" + encodeURIComponent(qName) + "&fields=sheets(data(rowData(values(effectiveValue(errorValue)))))";
    fetch(url, { method: "GET", headers: { "Authorization": "Bearer " + state.oauthToken } })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        var rowData = (data && data.sheets && data.sheets[0] && data.sheets[0].data && data.sheets[0].data[0] && data.sheets[0].data[0].rowData) || [];
        var now = errsOfRowData(rowData), news = [];
        Object.keys(now).forEach(function(k) { if (!(k in snap.errs)) news.push(k + " " + now[k]); });
        snap.errs = now;
        done(news);
      })
      .catch(function() { done([]); });
  }

  function getSnapCellFmt(sheetName, r0, c0) {
    var snap = state.sheetSnapshot[sheetName];
    if (!snap || !snap.cells || !snap.cells[r0] || !snap.cells[r0][c0]) return {};
    return snap.cells[r0][c0];
  }

  function resolveTableRangeStr(includeHeader) {
    if (!state.table || !state.table.first_col || !state.table.last_col) return "";
    var dm = String(state.table.data || "").match(/^([0-9]+)-([0-9]+)$/);
    var startRow = includeHeader ? Number(state.table.header_row || (dm ? dm[1] : 0)) : (dm ? parseInt(dm[1], 10) : 0);
    var endRow = state.table.total_row ? Number(state.table.total_row) : (dm ? parseInt(dm[2], 10) : Number(state.table.last_row || startRow));
    if (!startRow || !endRow || endRow < startRow) return "";
    return state.table.first_col + startRow + ":" + state.table.last_col + endRow;
  }

  function toUserEnteredValue(val) {
    if (val === null || val === undefined || val === "") return {};
    if (typeof val === "number" && isFinite(val)) return { numberValue: val };
    if (typeof val === "boolean") return { boolValue: val };
    var s = String(val);
    if (s.charAt(0) === "=") return { formulaValue: s };
    return { stringValue: s };
  }

  var BANDING_THEMES = {
    gray: { header: "#616161", first: "#FFFFFF", second: "#F5F5F5" },
    blue: { header: "#1565C0", first: "#FFFFFF", second: "#E3F2FD" },
    green: { header: "#2E7D32", first: "#FFFFFF", second: "#E8F5E9" },
    orange: { header: "#EF6C00", first: "#FFFFFF", second: "#FFF3E0" }
  };

  function buildDirectBatchUpdate(ops, sheetName) {
    if (!Array.isArray(ops) || !ops.length) return null;
    if (!state.oauthToken || !state.target.id || state.target.kind !== "sheet" || !sheetName) return null;
    if (els.chkBackup.checked) return null;
    if (typeof state.sheetIdMap[sheetName] !== "number") return null;

    var sheetId = state.sheetIdMap[sheetName];
    var requests = [];
    var undoRequests = [];
    var snapshotMutators = [];
    var undoSnapshotMutators = [];
    var changed = [];
    var whatList = [];

    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      if (!op || !op.shelf) return null;
      if (op.sheet && op.sheet !== sheetName) return null;
      // 背景色を消す棚は、書式の道で「背景色の欄を空で送る」＝塗りつぶしなしに戻す
      var bgClear = op.shelf === "bg.clear";
      if (bgClear) op = Object.assign({}, op, { shelf: "format" });

      if (op.shelf === "format") {
        var targetA1 = "";
        if (op.title) {
          targetA1 = (state.table && state.table.title_a1) || "A1";
        } else if (op.header) {
          if (!state.table || !state.table.header_row || !state.table.first_col || !state.table.last_col) return null;
          targetA1 = state.table.first_col + state.table.header_row + ":" + state.table.last_col + state.table.header_row;
        } else if (op.col) {
          var colL = resolveColLetterFromTable(op.col);
          if (!colL || !state.table || !state.table.data) return null;
          var dm = String(state.table.data).match(/^([0-9]+)-([0-9]+)$/);
          if (!dm) return null;
          var rStart = parseInt(dm[1], 10);
          var rEnd = state.table.total_row ? Number(state.table.total_row) : parseInt(dm[2], 10);
          targetA1 = colL + rStart + ":" + colL + rEnd;
        } else if (op.range) {
          targetA1 = String(op.range).trim();
        } else {
          return null;
        }

        var parsedRg = parseSimpleA1Range(targetA1, sheetId);
        if (!parsedRg) return null;

        var cellFmt = {};
        var textFmt = {};
        var hasTextFmt = false;
        var fields = [];
        var did = [];

        if (op.bold !== undefined) {
          textFmt.bold = !!op.bold;
          hasTextFmt = true;
          fields.push("userEnteredFormat.textFormat.bold");
          did.push("bold");
        }
        if (op.italic !== undefined) {
          textFmt.italic = !!op.italic;
          hasTextFmt = true;
          fields.push("userEnteredFormat.textFormat.italic");
          did.push("italic");
        }
        if (op.color !== undefined) {
          var rgbFg = parseColorToRgbObj(op.color);
          if (!rgbFg) return null;
          textFmt.foregroundColorStyle = { rgbColor: rgbFg };
          hasTextFmt = true;
          fields.push("userEnteredFormat.textFormat.foregroundColorStyle");
          did.push("color");
        }
        if (bgClear) {
          fields.push("userEnteredFormat.backgroundColorStyle");
          did.push("bg");
        } else if (op.bg !== undefined) {
          var rgbBg = parseColorToRgbObj(op.bg);
          if (!rgbBg) return null;
          cellFmt.backgroundColorStyle = { rgbColor: rgbBg };
          fields.push("userEnteredFormat.backgroundColorStyle");
          did.push("bg");
        }
        if (op.size !== undefined) {
          textFmt.fontSize = Number(op.size);
          hasTextFmt = true;
          fields.push("userEnteredFormat.textFormat.fontSize");
          did.push("size");
        }
        if (op.font !== undefined) {
          textFmt.fontFamily = String(op.font);
          hasTextFmt = true;
          fields.push("userEnteredFormat.textFormat.fontFamily");

    }
    setBusy(true, "実行中…");
    switchTab("chat");

    var t0 = performance.now();
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id) + ":batchUpdate";
    fetch(url, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.oauthToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ requests: plan.requests })
    })
      .then(function(res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function(resJson) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        plan.applySnapshot(resJson);
        if (plan.undoRequests && plan.undoRequests.length) {
          state.directUndoStack.push({
            sheet: sheetName,
            what: plan.what || "format",
            requests: plan.undoRequests,
            restoreSnapshot: plan.restoreSnapshot
          });
        }
        var lines = [];
        if (isFromAsk) {
          lines.push("[棚ヒット] " + formatOpsShort(ops));
        }
        lines.push("対象: " + (state.target.name || "(名前なし)") + " › " + sheetName);
        lines.push("直した所: " + plan.changed.slice(0, 2).join(" ／ "));
        lines.push("控えなし（backup=OFF）");
        checkNewErrorsAfterDirect(sheetName, ops, function(news) {
          if (news.length) lines.push("⚠ 新しいエラー: " + news.slice(0, 5).join("・") + (news.length > 5 ? " ほか " + (news.length - 5) + " 件" : "") + "（直前を取り消すで戻せます）");
          recordExecution(true, label, lines.join("\n"), wallMs, 0, true, true);
        });
      })
      .catch(function() {
        setBusy(false);
        if (fallbackFn) fallbackFn();
      });
    return true;
  }

  function tryDirectUndo(fallbackFn) {
    if (typeof fetch !== "function" || !state.oauthToken || !state.target.id || !state.directUndoStack.length) {
      return false;
    }
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return true;
    }
    var item = state.directUndoStack.pop();
    setBusy(true, "取り消し中…");
    switchTab("chat");

    var t0 = performance.now();
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id) + ":batchUpdate";
    fetch(url, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.oauthToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ requests: item.requests })
    })
      .then(function(res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function() {
        var wallMs = performance.now() - t0;
        setBusy(false);
        if (item.restoreSnapshot) item.restoreSnapshot();
        var body = [
          "対象: " + (state.target.name || "(名前なし)") + " › " + item.sheet,
          "戻した: " + item.what + " を取り消しました（直接API戻し）"
        ].join("\n");
        recordExecution(true, "直前を取り消す", body, wallMs, 0, true, true);
      })
      .catch(function() {
        setBusy(false);
        if (fallbackFn) fallbackFn();
      });
    return true;
  }

  function handlePostboxDone(doneItems) {
    if (!doneItems) return;
    var items = Array.isArray(doneItems) ? doneItems : [doneItems];
    var handled = 0;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!it || typeof it !== "object") continue;
      handled++;
      if (it.reqId) delete state.pendingPostboxIds[it.reqId];
      var ok = it.ok !== false;
      var label = it.ask || it.label || "郵便受けAI実行";
      var body = it.text || it.error || "";
      var gasMs = (typeof it.gasMs === "number") ? it.gasMs : undefined;
      appendLog(
        els.chatLog,
        ok ? "is-ok" : "is-err",
        "[" + (ok ? "✓" : "✗") + " 郵便受け] " + label,
        body + (gasMs !== undefined ? "\n(GAS " + (gasMs / 1000).toFixed(2) + "s)" : "")
      );
      if (it.table !== undefined) state.table = it.table;
    }
    if (handled > 0) {
      updateInfoLabel();
      updatePreview();
      els.postboxStatusLabel.textContent = "郵便受け: 完了結果 " + handled + "件を受信しました";
    }
  }

  // ---- アクション実行 ----
  function runServerAction(opts) {
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return;
    }
    var switchChat = opts.switchToChat !== false;
    setBusy(true, opts.statusText || "実行中…");
    if (switchChat) switchTab("chat");

    var t0 = performance.now();
    callGas(
      opts.fnName,
      opts.payload,
      function(res) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        setTimeout(function() { quickCheckBuild(true); }, 0);

        if (!res || res.ok === false) {
          var errMsg = (res && (res.text || res.error)) || "実行に失敗しました";
          if (res && res.needs_ok && errMsg.indexOf("確認なし") === -1) {
            errMsg += "\n（「確認なし」にチェックを入れて再実行してください）";
          }
          recordExecution(false, opts.label, errMsg, wallMs, res && res.gasMs, true);
          return;
        }

        if (opts.onSuccess) opts.onSuccess(res);
        applyServerState(res);

        if (res.pendingPostbox) {
          if (res.reqId) state.pendingPostboxIds[res.reqId] = true;
          els.postboxStatusLabel.textContent = "郵便受け: 待機中 (ID: " + (res.reqId || "-") + ")";
          var pText = res.text || "郵便受けに依頼を置きました。PC側の watch が処理するまで待機します。";
          appendLog(els.chatLog, "is-info", "[郵便受け待機] " + opts.label, pText + "\n(" + formatTiming(wallMs, res.gasMs) + ")");
          appendLog(els.traceLog, "is-info", "[… " + opts.label + "] " + formatTiming(wallMs, res.gasMs), "");
          kickWatcher();
          schedulePoll(1200);
          return;
        }

        if (!opts.silentSuccess) {
          recordExecution(true, opts.label, res.text || "完了", wallMs, res.gasMs, switchChat);
        }
      },
      function(err) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        recordExecution(false, opts.label, formatError(err), wallMs, undefined, true);
      }
    );
  }

  function onInit(silent) {
    runServerAction({
      fnName: "comboInit",
      payload: {
        targetId: state.target.id || "",
        sheet: state.curSheet || "",
        assumeActive: true
      },
      label: "初期化 / 再読込",
      statusText: "読込中…",
      switchToChat: false,
      silentSuccess: !!silent,
      onSuccess: function(res) {
        if (res.postboxDone) handlePostboxDone(res.postboxDone);
        loadLearned();
      }
    });
  }

  function onLook(sheetOverride) {
    var targetSheet = (typeof sheetOverride === "string") ? sheetOverride : (els.sheetSelect.value || state.curSheet || "");
    runServerAction({
      fnName: "comboLook",
      payload: {
        targetId: state.target.id || "",
        sheet: targetSheet,
        assumeActive: true
      },
      label: "読込 (comboLook)",
      statusText: "読込中…",
      switchToChat: false
    });
  }

  function hasSelectionPronoun(txt) {
    return /(ここ|このセル|選択範囲|選択セル|この行|この列|この範囲|今のセル)/.test(txt || "");
  }

  function onRunAsk() {
    var txt = (els.askInput.value || "").trim();
    if (!txt) return;
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return;
    }
    // 「選択セル」「この」等、今選んでいる所を指す頼みは、先に選んでいる所を読み直してから棚に当てる
    // （GASクイックの大元はサーバー側で棚を当てないので、サーバーへ回すと撃てない）
    if (els.chkSync.checked && hasSelectionPronoun(txt) && !state.liveSelDone) {
      setBusy(true, "選んでいる所を読んでいます…");
      var again = function() {
        setBusy(false);
        state.liveSelDone = true;
        try { onRunAsk(); } finally { state.liveSelDone = false; }
      };
      callGas("comboPollSelection", { targetId: state.target.id || "", sheet: "" },
        function(res) { if (res && res.ok) applyServerState(res); again(); }, again);
      return;
    }
    pushHistory(txt);

    var liveSelPrompt = !state.liveSelDone && !!(els.chkSync.checked && hasSelectionPronoun(txt));
    var planRes = updatePreview();
    var fireOps = (!liveSelPrompt && planRes && planRes.fire && Array.isArray(planRes.ops) && planRes.ops.length) ? planRes.ops : null;
    var aiAuto = !!els.chkAiAuto.checked;

    els.askInput.value = "";
    updatePreview();

    // 近い候補があれば、AI自動でも先に［はい］を出す（郵便受けの受け手がいなくても止まらない。［いいえ］なら AI へ回す）
    var suggestOps = (!fireOps && !liveSelPrompt && planRes && Array.isArray(planRes.suggest) && planRes.suggest.length) ? planRes.suggest : null;

    var statusText = (!fireOps && aiAuto) ? "AI解釈・実行中…" : "実行中…";
    var payload = {
      ask: txt,
      ops: fireOps,
      ok: !!els.chkOk.checked,
      backup: !!els.chkBackup.checked,
      aiAuto: aiAuto,
      assumeActive: true,
      targetId: state.target.id || "",
      targetName: state.target.name || "",
      sheets: state.sheets || [],
      sheet: liveSelPrompt ? "" : (state.curSheet || ""),
      table: state.table
    };
    if (!liveSelPrompt) {
      payload.selection = els.chkSync.checked ? (state.selection || "") : "";
    }
    if (suggestOps) {
      offerSuggest(txt, suggestOps, aiAuto ? function() {
        runServerAction({ fnName: "comboRunAsk", payload: payload, label: txt, statusText: statusText, switchToChat: true });
      } : null);
      return;
    }
    if (fireOps && !liveSelPrompt && !els.chkBackup.checked) {
      var handledDirect = tryDirectSheetsApi(fireOps, txt, true, function() {
        runServerAction({
          fnName: "comboRunAsk",
          payload: payload,
          label: txt,
          statusText: statusText,
          switchToChat: true
        });
      });
      if (handledDirect) return;
    }

    state.directUndoStack = [];
    runServerAction({
      fnName: "comboRunAsk",
      payload: payload,
      label: txt,
      statusText: statusText,
      switchToChat: true
    });
  }

  // ===== GASクイック: 直したら自分で開き直す =====
  // 組み立てのときに quick.py がこの操作窓の版の印を埋める。大元の印と違えば、新しい操作窓に入れ替える
  var QUICK_SIDEBAR_BUILD = "d9f165b8a5";
  var quickBuildAt = 0;
  function quickCheckBuild(force) {
    if (!QUICK_SIDEBAR_BUILD || !hasGasBridge()) return;
    var now = Date.now();
    if (!force && now - quickBuildAt < 4000) return;
    quickBuildAt = now;
    callGas("comboQuickBuild", {}, function(res) {
      if (res && res.ok && res.build && res.build !== QUICK_SIDEBAR_BUILD && !state.busy) {
        els.quickNote.textContent = "新しい版に入れ替えています…";
        callGas("comboQuickReopen", { draft: els.askInput.value || "" });
      }
    });
  }
  window.addEventListener("focus", function() { quickCheckBuild(false); });
  document.addEventListener("visibilitychange", function() { if (!document.hidden) quickCheckBuild(false); });

  // ===== GASクイック: 一覧 =====
  function quickShelfItems() {
    var shelves = (typeof COMBO_CATALOG_DATA !== "undefined" && COMBO_CATALOG_DATA.shelves) || [];
    return shelves.filter(function(sh) { return sh.searchable !== false && sh.kind !== "doc"; }).map(function(sh) {
      var needArgs = (sh.args || []).some(function(a) { return a.req; });
      return { src: "shelf", name: sh.name, label: sh.title || sh.name, words: sh.words || [], desc: "", needArgs: needArgs };
    });
  }

  function quickOrdered(list, order) {
    var pos = {};
    (order || []).forEach(function(n, i) { pos[n] = i; });
    return list.map(function(it, i) { return { it: it, i: i }; }).sort(function(a, b) {
      // 覚えに無い物（新しく足した物）は、区切りの一番上に、コードの順で並べる
      var pa = pos.hasOwnProperty(a.it.name) ? pos[a.it.name] : -100000 + a.i;
      var pb = pos.hasOwnProperty(b.it.name) ? pos[b.it.name] : -100000 + b.i;
      return pa - pb;
    }).map(function(x) { return x.it; });
  }

  function quickAllItems() {
    var q = state.quick, sheet = [], my = [];
    (q.sheet || []).forEach(function(f) { sheet.push({ src: "sheet", name: f.name, label: f.name, words: [], desc: "" }); });
    (q.my || []).forEach(function(f) { my.push({ src: "my", name: f.name, label: f.name, words: f.words || [], desc: f.desc || "" }); });
    return quickOrdered(sheet, q.order.sheet).concat(quickOrdered(my, q.order.my), quickOrdered(quickShelfItems(), q.order.shelf));
  }

  // ===== 並べ替え（区切りの中だけ） =====
  var quickSaveTimer = {};
  function quickMove(dir) {
    var q = state.quick, items = q.items || [], it = items[q.sel];
    if (!it || (els.askInput.value || "").trim()) return;
    var j = q.sel + dir, other = items[j];
    if (!other || other.src !== it.src) return;
    var group = items.filter(function(x) { return x.src === it.src; }).map(function(x) { return x.name; });
    var a = group.indexOf(it.name), b = group.indexOf(other.name);
    group[a] = other.name; group[b] = it.name;
    q.order[it.src] = group;
    q.sel = j;
    renderQuickList();
    var row = els.quickList.querySelectorAll(".quick-item")[j];
    if (row && row.scrollIntoView) row.scrollIntoView({ block: "nearest" });
    if (it.src !== "sheet") quickRememberLocal();
    clearTimeout(quickSaveTimer[it.src]);
    quickSaveTimer[it.src] = setTimeout(function() {
      callGas("comboQuickSaveOrder", { kind: it.src, names: group });
    }, 700);
  }

  function quickMoveButtons(idx) {
    var items = state.quick.items || [], it = items[idx];
    var box = document.createElement("span");
    box.className = "quick-move";
    var filtering = !!(els.askInput.value || "").trim();
    [["▲", -1], ["▼", 1]].forEach(function(d) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = d[0];
      b.title = d[1] < 0 ? "上へ（Alt+↑）" : "下へ（Alt+↓）";
      var nb = items[idx + d[1]];
      b.disabled = filtering || !nb || nb.src !== it.src;
      b.addEventListener("click", function(e) { e.stopPropagation(); quickMove(d[1]); });
      b.addEventListener("dblclick", function(e) { e.stopPropagation(); });
      box.appendChild(b);
    });
    return box;
  }

  document.addEventListener("keydown", function(e) {
    if (state.activeTab !== "list" || !e.altKey || state.quick.sel < 0) return;
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      quickMove(e.key === "ArrowUp" ? -1 : 1);
    }
  });

  function quickNorm(t) { return String(t || "").toLowerCase().replace(/[\s　]+/g, ""); }

  function quickScore(item, txt) {
    if (!txt) return 1;
    var t = quickNorm(txt), best = 0;
    [item.label, item.name].concat(item.words || []).forEach(function(w) {
      var n = quickNorm(w);
      if (!n) return;
      if (n === t) best = Math.max(best, 100);
      else if (n.indexOf(t) >= 0) best = Math.max(best, 60);
      else if (t.indexOf(n) >= 0 && n.length >= 2) best = Math.max(best, 40 + Math.min(n.length, 20));
    });
    if (!best && item.desc && quickNorm(item.desc).indexOf(t) >= 0) best = 30;
    return best;
  }

  function quickFiltered() {
    var txt = (els.askInput.value || "").trim();
    var all = quickAllItems();
    if (!txt) return all;
    var srcRank = { sheet: 2, my: 2, shelf: 1 };
    return all.map(function(it, i) { return { it: it, s: quickScore(it, txt), i: i }; })
      .filter(function(x) { return x.s > 0; })
      .sort(function(a, b) { return (b.s - a.s) || (srcRank[b.it.src] - srcRank[a.it.src]) || (a.i - b.i); })
      .map(function(x) { return x.it; });
  }

  var QUICK_TAG = { sheet: "シート", my: "マイ", shelf: "棚" };

  function renderQuickList() {
    var items = quickFiltered();
    state.quick.items = items;
    els.quickList.innerHTML = "";
    if (!items.length) {
      var empty = document.createElement("div");
      empty.className = "log-empty";
      empty.textContent = state.quick.loaded ? "当たるマクロがありません（実行で頼みとして撃ちます）" : "読込中…";
      els.quickList.appendChild(empty);
    }
    items.forEach(function(it, idx) {
      var row = document.createElement("div");
      row.className = "hist-item quick-item" + (state.quick.sel === idx ? " selected" : "");
      var tag = document.createElement("span");
      tag.className = "quick-tag t-" + it.src;
      tag.textContent = QUICK_TAG[it.src];
      var lab = document.createElement("span");
      lab.className = "quick-label";
      lab.textContent = it.label;
      row.appendChild(tag);
      row.appendChild(lab);
      // 一覧は 1 行ずつ。説明は指したとき（マウスを載せる）に下の欄と吹き出しに出す
      var tip = it.desc || (it.src === "shelf" ? ("棚: " + it.name) : it.label);
      row.title = tip;
      row.addEventListener("mouseenter", function() { if (!state.quick.importMode) els.quickNote.textContent = tip; });
      // 1 回押せば選ぶ・2 回押せば撃つ（選んでから「実行」でも撃てる）
      row.addEventListener("click", function() {
        if (state.busy) return;
        state.quick.sel = idx;
        if (state.quick.importMode) {
          if (it.src !== "sheet") { els.quickNote.textContent = "写せるのは「シート」の印のマクロだけです"; return; }
          setQuickImportMode(false);
          quickImportItem(it);
          return;
        }
        quickMarkSel(idx);
      });
      row.addEventListener("dblclick", function() {
        if (state.busy || state.quick.importMode) return;
        state.quick.sel = idx;
        quickMarkSel(idx);
        quickRunItem(it);
      });
      if (state.quick.sel === idx) row.appendChild(quickMoveButtons(idx));
      els.quickList.appendChild(row);
    });
    var q = state.quick;
    els.btnQuickImport.disabled = !q.importMode && !(q.sheet || []).length;
    els.btnQuickImport.textContent = q.importMode ? "やめる" : "マイマクロへ";
    els.quickList.style.outline = q.importMode ? "2px solid #16a34a" : "";
    els.btnQuickEdit.textContent = q.myId ? "編集" : "マイマクロを作る";
  }

  // 選んだ印だけを付け替える（一覧を描き直すと、ダブルクリックの 2 回目が別の行に当たって撃てなくなる）
  function quickMarkSel(idx) {
    var rows = els.quickList.querySelectorAll(".quick-item");
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle("selected", i === idx);
      var mv = rows[i].querySelector(".quick-move");
      if (mv && i !== idx) mv.parentNode.removeChild(mv);
      if (i === idx && !mv) rows[i].appendChild(quickMoveButtons(idx));
    }
  }

  var QUICK_LS_KEY = "gasquick_list_v1";
  function quickRestoreList() {
    try {
      var raw = window.localStorage.getItem(QUICK_LS_KEY);
      if (raw) {
        var c = JSON.parse(raw), q = state.quick;
        // シートのマクロはシートごとに違うので覚えから出さない（マイマクロはどのシートでも同じ）
        q.my = c.my || []; q.myId = c.myId || ""; q.myUrl = c.myUrl || "";
        if (c.order) { q.order.my = c.order.my || []; q.order.shelf = c.order.shelf || []; }
      }
    } catch (e) {}
    state.quick.loaded = true;
    renderQuickList();
  }

  function quickRememberLocal() {
    var q = state.quick;
    try {
      window.localStorage.setItem(QUICK_LS_KEY, JSON.stringify({ my: q.my || [], myId: q.myId || "", myUrl: q.myUrl || "",
        order: { my: q.order.my || [], shelf: q.order.shelf || [] } }));
    } catch (e) {}
  }

  function loadQuickList() {
    callGas("comboQuickList", {}, function(res) {
      var q = state.quick;
      q.loaded = true;
      if (res && res.ok) {
        q.sheet = res.sheet || [];
        if (res.order) q.order = { sheet: res.order.sheet || [], my: res.order.my || [], shelf: res.order.shelf || [] };
        q.my = res.my || [];
        q.myId = res.myId || "";
        q.myUrl = res.myUrl || "";
        quickRememberLocal();
        if (res.draft && !els.askInput.value) { els.askInput.value = res.draft; updatePreview(); }
        if (res.build && QUICK_SIDEBAR_BUILD && res.build !== QUICK_SIDEBAR_BUILD) { quickCheckBuild(true); }
        els.quickNote.textContent = res.addonNote ? res.addonNote : res.myError ? ("マイマクロを読めませんでした: " + res.myError)
          : (q.myId ? "" : "「マイマクロを作る」を押すと、どのシートでも使える自分のマクロ置き場ができます");
      }
      renderQuickList();
    }, function(err) {
      state.quick.loaded = true;
      els.quickNote.textContent = "一覧を読めませんでした: " + formatError(err);
      renderQuickList();
    });
  }

  function quickRunItem(it) {
    if (!it) return;
    if (it.src === "shelf") {
      if (it.needArgs) {
        els.askInput.value = it.label;
        els.askInput.focus();
        updatePreview();
        els.quickNote.textContent = "棚「" + it.label + "」は言葉を足してから実行してください（例: どの列・何色）";
        return;
      }
      onRunOps([{ shelf: it.name }], it.label);
      return;
    }
    state.directUndoStack = [];
    runServerAction({
      fnName: "comboQuickRun",
      payload: { src: it.src, name: it.name, myId: state.quick.myId },
      label: (it.src === "my" ? "マイマクロ " : "マクロ ") + it.name,
      statusText: it.name + " を実行中…",
      switchToChat: false,
      onSuccess: function(res) { els.quickNote.textContent = res.text || "完了"; }
    });
  }

  // 入力欄の Enter: 選んでいる物、または言葉がシートのマクロ・マイマクロに当たればそれを撃つ（棚は今までどおり頼みとして撃つ）
  function quickRunFromInput() {
    var items = state.quick.items || [];
    var it = state.quick.sel >= 0 ? items[state.quick.sel] : null;
    var txt = (els.askInput.value || "").trim();
    if (!it && txt && items.length && items[0].src !== "shelf" && quickScore(items[0], txt) >= 60) it = items[0];
    if (!it) return false;
    if (it.src === "shelf" && txt) return false;
    pushHistory(txt || it.label);
    els.askInput.value = "";
    updatePreview();
    state.quick.sel = -1;
    renderQuickList();
    quickRunItem(it);
    return true;
  }

  function onRunOps(ops, customLabel) {
    var label = customLabel || formatOpsShort(ops) || "ops実行";
    var runViaGas = function() {
      state.directUndoStack = [];
      runServerAction({
        fnName: "comboRunOps",
        payload: {
          ops: ops,
          ok: !!els.chkOk.checked,
          backup: !!els.chkBackup.checked,
          assumeActive: true,
          targetId: state.target.id || "",
          targetName: state.target.name || "",
          sheets: state.sheets || [],
          sheet: state.curSheet || "",
          selection: els.chkSync.checked ? (state.selection || "") : "",
          table: state.table
        },
        label: label,
        statusText: "実行中…",
        switchToChat: true
      });
    };
    if (!els.chkBackup.checked && tryDirectSheetsApi(ops, label, false, runViaGas)) {
      return;
    }
    runViaGas();
  }

  function onUndo() {
    var undoViaGas = function() {
      runServerAction({
        fnName: "comboUndo",
        payload: {
          ok: !!els.chkOk.checked,
          targetId: state.target.id || "",
          assumeActive: true
        },
        label: "直前を取り消す",
        statusText: "取り消し中…",
        switchToChat: true
      });
    };
    if (tryDirectUndo(undoViaGas)) {
      return;
    }
    undoViaGas();
  }

  function onAutoWidth() {
    var scope = getActiveScope();
    if (els.chkSync.checked && scope && Array.isArray(scope.cols) && scope.cols.length &&
        (scope.col_select || scope.cols.length > 1)) {
      onRunOps([{ shelf: "width", auto: scope.cols }], "列幅自動");
      return;
    }
    var cols = (state.table && Array.isArray(state.table.columns))
      ? state.table.columns.map(function(c) { return c.col; }).filter(Boolean)
      : [];
    if (cols.length) {
      onRunOps([{ shelf: "width", auto: cols }], "列幅自動");
      return;
    }
    runServerAction({
      fnName: "comboRunAsk",
      payload: {
        ask: "全ての列の幅を中身に合わせて",
        ok: !!els.chkOk.checked,
        backup: !!els.chkBackup.checked,
        aiAuto: !!els.chkAiAuto.checked,
        targetId: state.target.id || "",
        targetName: state.target.name || "",
        sheets: state.sheets || [],
        sheet: state.curSheet || "",
        selection: els.chkSync.checked ? (state.selection || "") : "",
        table: state.table
      },
      label: "列幅自動",
      statusText: "実行中…",
      switchToChat: true
    });
  }

  function onFreezeHeader() {
    var hr = (state.table && state.table.header_row) ? state.table.header_row : 1;
    onRunOps([{ shelf: "freeze", rows: hr }], "見出し固定");
  }

  function onFindShelf() {
    var txt = (els.askInput.value || "").trim();
    var kind = (state.target && state.target.kind) || "sheet";
    if (typeof Planner.ask === "function") {
      var t0 = performance.now();
      var resText = String(Planner.ask(txt, kind) || "");
      var elapsed = performance.now() - t0;
      recordExecution(true, "棚検索: " + (txt || "一覧") + " (ローカル0ms)", resText, elapsed, 0, true);
      return;
    }
    runServerAction({
      fnName: "comboFind",
      payload: { ask: txt, kind: kind },
      label: "棚検索: " + (txt || "一覧"),
      statusText: "棚検索中…",
      switchToChat: true
    });
  }

  function onSaveConfig() {
    var mode = els.cfgAiMode.value;
    var model = els.cfgAiModel.value;
    var rawKey = (els.cfgApiKey.value || "").trim();
    var cfgPayload = {
      aiMode: mode,
      aiModel: model,
      backupDefault: !!els.chkBackup.checked
    };
    if (rawKey) {
      cfgPayload.apiKey = rawKey;
      if (mode === "api_gemini") cfgPayload.geminiKey = rawKey;
      if (mode === "api_claude") cfgPayload.claudeKey = rawKey;
    }

    runServerAction({
      fnName: "comboSaveConfig",
      payload: cfgPayload,
      label: "設定を保存",
      statusText: "設定保存中…",
      switchToChat: false,
      onSuccess: function(res) {
        els.cfgApiKey.value = "";
        if (rawKey) {
          state.config.hasApiKey = true;
          if (mode === "api_gemini") state.config.hasGeminiKey = true;
          if (mode === "api_claude") state.config.hasClaudeKey = true;
        }
        applyConfig(res.config || res);
        els.postboxStatusLabel.textContent = "設定を保存しました（方式: " + mode + " / モデル: " + model + "）";
      }
    });
  }

  function onCheckPostbox() {
    if (state.polling) return;
    state.polling = true;
    els.postboxStatusLabel.textContent = "郵便受け: 確認中…";
    var t0 = performance.now();
    callGas(
      "comboPollSelection",
      {
        targetId: state.target.id || "",
        sheet: state.curSheet || "",
        checkPostbox: true
      },
      function(res) {
        state.polling = false;
        var ms = (performance.now() - t0).toFixed(0);
        if (res && res.ok) {
          applyServerState(res);
          if (res.postboxDone && (!Array.isArray(res.postboxDone) || res.postboxDone.length > 0)) {
            handlePostboxDone(res.postboxDone);
          } else if (typeof res.postboxPending === "number") {
            els.postboxStatusLabel.textContent = "郵便受け: 待機中の依頼 " + res.postboxPending + "件 (" + ms + "ms)";
          } else {
            var pendCount = Object.keys(state.pendingPostboxIds).length;
            els.postboxStatusLabel.textContent = pendCount > 0
              ? ("郵便受け: 処理待ち " + pendCount + "件（PC側 watch を確認してください）")
              : ("郵便受け: 正常・待機中 (" + ms + "ms)");
          }
        } else {
          els.postboxStatusLabel.textContent = "郵便受け: 確認エラー";
        }
      },
      function(err) {
        state.polling = false;
        els.postboxStatusLabel.textContent = "郵便受けエラー: " + formatError(err);
      }
    );
  }

  // PC の郵便受けの受け手（py gas.py combo watch）を起こす。届かなければ動いていないと知らせる
  function kickWatcher() {
    try {
      fetch("http://127.0.0.1:18766/kick", { mode: "no-cors", cache: "no-store" }).catch(function() {
        els.postboxStatusLabel.textContent = "郵便受け: PC の受け手が動いていません（py gas.py combo watch <id> --autostart を 1 回）";
        appendLog(els.chatLog, "is-err", "[郵便受け] PC の受け手が動いていません",
          "PC で py gas.py combo watch <アドオンのID> --autostart を 1 回撃つと、ログオンのたびに自分で起きます（combo addon でも入ります）。");
      });
    } catch (e) {}
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function() {
        return fallbackCopy(text);
      });
    }
    return fallbackCopy(text);
  }

  function fallbackCopy(text) {
    return new Promise(function(resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) resolve();
        else reject(new Error("コピーに失敗しました"));
      } catch (e) {
        reject(e);
      }
    });
  }

  function onCopyForAi() {
    var txt = (els.askInput.value || "").trim();
    var url = (state.target && state.target.url) || "";
    var sh = state.curSheet || "";
    var selPart = state.selection ? ("・選択: " + state.selection) : "";
    var msg = url ? ("対象: " + url + "（シート: " + sh + selPart + "）\n依頼: " + txt) : txt;
    if (!msg) {
      appendLog(els.chatLog, "is-info", "[コピー]", "コピーする対象情報や入力文がありません。");
      return;
    }
    copyToClipboard(msg).then(function() {
      appendLog(els.chatLog, "is-ok", "[AIへコピー完了]", msg);
    }).catch(function(err) {
      appendLog(els.chatLog, "is-err", "[コピー失敗]", formatError(err));
    });
  }

  // ---- 郵便受け完了待ちポーリング（常時ポーリングは行わない） ----
  function schedulePoll(delayMs) {
    if (state.pollTimer) {
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
    var hasPending = Object.keys(state.pendingPostboxIds).length > 0;
    if (!hasPending || !hasGasBridge()) return;

    state.pollTimer = setTimeout(runPollTick, delayMs || 1800);
  }

  function runPollTick() {
    state.pollTimer = null;
    var hasPending = Object.keys(state.pendingPostboxIds).length > 0;
    if (!hasPending) return;
    if (document.hidden || state.busy || state.polling) {
      schedulePoll(2000);
      return;
    }
    state.polling = true;
    callGas(
      "comboPollSelection",
      {
        targetId: state.target.id || "",
        sheet: state.curSheet || ""
      },
      function(res) {
        state.polling = false;
        if (res && res.ok !== false) {
          var prevSheet = state.curSheet;
          var prevSel = state.selection;
          if (typeof res.sheet === "string" && res.sheet && res.sheet !== prevSheet) {
            state.curSheet = res.sheet;
            syncSheetSelects();
          }
          if (typeof res.selection === "string") {
            state.selection = res.selection.toUpperCase();
          }
          if (res.scope && typeof res.scope === "object") {
            state.scope = res.scope;
          } else if (state.selection && Planner.parseSelectionScope) {
            state.scope = Planner.parseSelectionScope(state.selection);
          } else {
            state.scope = {};
          }
          if (typeof res.heading === "string") {
            state.heading = res.heading;
          }
          if (res.postboxDone) {
            handlePostboxDone(res.postboxDone);
          }
          if (state.curSheet !== prevSheet || state.selection !== prevSel) {
            updateSelectionLabel();
            updatePreview();
          }
        }
        if (Object.keys(state.pendingPostboxIds).length > 0) {
          schedulePoll(1800);
        }
      },
      function() {
        state.polling = false;
        if (Object.keys(state.pendingPostboxIds).length > 0) {
          schedulePoll(3000);
        }
      }
    );
  }

  // ---- キーボード操作（Enter実行・Shift+Enter改行・上下履歴） ----
  function getCursorLineInfo(ta) {
    var val = ta.value || "";
    var pos = ta.selectionStart || 0;
    var before = val.slice(0, pos);
    var lineIdx = before.split("\n").length - 1;
    var totalLines = val.split("\n").length;
    return { lineIdx: lineIdx, totalLines: totalLines };
  }

  els.askInput.addEventListener("keydown", function(e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (state.activeTab === "list" && quickRunFromInput()) return;
      onRunAsk();
      return;
    }
    if (e.key === "ArrowUp") {
      var infoUp = getCursorLineInfo(els.askInput);
      if (infoUp.lineIdx === 0 && state.history.length > 0) {
        e.preventDefault();
        if (state.histIdx < 0 || state.histIdx > state.history.length) {
          state.histIdx = state.history.length;
        }
        state.histIdx = Math.max(0, state.histIdx - 1);
        els.askInput.value = state.history[state.histIdx] || "";
        updatePreview();
      }
      return;
    }
    if (e.key === "ArrowDown") {
      var infoDown = getCursorLineInfo(els.askInput);
      if (infoDown.lineIdx === infoDown.totalLines - 1 && state.history.length > 0) {
        e.preventDefault();
        state.histIdx = Math.min(state.history.length, state.histIdx + 1);
        els.askInput.value = (state.histIdx >= state.history.length) ? "" : (state.history[state.histIdx] || "");
        updatePreview();
      }
    }
  });

  els.askInput.addEventListener("input", updatePreview);
  els.askInput.addEventListener("input", function() { state.quick.sel = -1; renderQuickList(); });
  els.askInput.addEventListener("keyup", updatePreview);

  // ---- ボタン・イベント配線 ----
  els.btnRun.addEventListener("click", onRunAsk);
  els.btnClear.addEventListener("click", function() {
    els.askInput.value = "";
    updatePreview();
    els.askInput.focus();
  });

  els.chkAiAuto.addEventListener("change", updatePreview);
  els.chkSync.addEventListener("change", function() {
    updateSelectionLabel();
    updatePreview();
  });
  els.chkBackup.addEventListener("change", function() {
    var on = !!els.chkBackup.checked;
    state.config.backupDefault = on;
    onRunOps([{ shelf: "backup", on: on }], "控え切替(" + (on ? "ON" : "OFF") + ")");
  });

  els.sheetSelect.addEventListener("change", function() {
    onLook(els.sheetSelect.value);
  });
  els.settingsSheetSelect.addEventListener("change", function() {
    onLook(els.settingsSheetSelect.value);
  });
  els.btnLook.addEventListener("click", function() { onLook(); });
  els.btnRefresh.addEventListener("click", function() { onInit(true); });

  var tabBtns = document.querySelectorAll(".tab-btn");
  for (var t = 0; t < tabBtns.length; t++) {
    tabBtns[t].addEventListener("click", function() {
      switchTab(this.getAttribute("data-tab"));
    });
  }

  els.btnSeiri.addEventListener("click", function() {
    onRunOps([{ shelf: "seiri" }], "【一発整形】データ整理 ＋ 表を整える");
  });
  els.btnDocStyle.addEventListener("click", function() {
    onRunOps([{ shelf: "doc.style" }], "【一発整形】文書の体裁を整える");
  });

  var quickBtns = document.querySelectorAll("#pane-auto .quick-grid .btn");
  for (var q = 0; q < quickBtns.length; q++) {
    quickBtns[q].addEventListener("click", function() {
      var opRaw = this.getAttribute("data-op");
      var action = this.getAttribute("data-action");
      var btnText = this.textContent.trim();
      if (opRaw) {
        try {
          onRunOps(JSON.parse(opRaw), btnText);
        } catch (e) {
          appendLog(els.chatLog, "is-err", "[✗ 操作解析エラー]", formatError(e));
        }
      } else if (action === "look") {
        onLook();
      } else if (action === "undo") {
        onUndo();
      } else if (action === "autoWidth") {
        onAutoWidth();
      } else if (action === "freezeHeader") {
        onFreezeHeader();
      } else if (action === "findShelf") {
        onFindShelf();
      }
    });
  }

  function flashBtn(b, t, label) { b.textContent = t; setTimeout(function() { b.textContent = label; }, 1500); }

  els.btnAgain.addEventListener("click", function() {
    var last = state.history.length ? state.history[state.history.length - 1] : "";
    if (!last) { flashBtn(els.btnAgain, "頼みがありません", "もう一度"); return; }
    els.askInput.value = last;
    onRunAsk();
  });

  // 直した所へ移る: シートの名前ボックスに番地を入れる（Chrome の拡張のサイドパネルで開いているとき）
  els.btnGoChanged.addEventListener("click", function() {
    var a1 = state.lastChanged || "";
    if (!a1) { flashBtn(els.btnGoChanged, "まだありません", "直した所"); return; }
    var bang = a1.lastIndexOf("!");
    if (bang > 0) {
      var sh = a1.slice(0, bang).replace(/^'|'$/g, "");
      a1 = "'" + sh.replace(/'/g, "''") + "'!" + a1.slice(bang + 1);
    }
    state.gotoWait = setTimeout(function() {
      state.gotoWait = null;
      flashBtn(els.btnGoChanged, "移れません", "直した所");
      appendLog(els.traceLog, "is-err", "[直した所] " + a1, "拡張から返事がありません（Chrome 拡張のサイドパネルで開いているときだけ効きます。拡張を chrome://extensions で再読み込み）");
    }, 1500);
    try { window.top.postMessage({ type: "GAS_COMBO_GOTO", range: a1 }, "*"); } catch (e) {}
  });
  window.addEventListener("message", function(ev) {
    var d = ev && ev.data;
    if (!d || d.type !== "GAS_COMBO_GOTO_DONE") return;
    if (state.gotoWait) { clearTimeout(state.gotoWait); state.gotoWait = null; }
    flashBtn(els.btnGoChanged, d.ok ? "移りました" : "移れません", "直した所");
    if (!d.ok) appendLog(els.traceLog, "is-err", "[直した所] 移れません", String(d.why || ""));
  });

  els.btnCopyLog.addEventListener("click", function() {
    var b = els.btnCopyLog, label = "会話をコピー";
    var txt = els.chatLog.querySelector(".log-empty") ? "" : String(els.chatLog.innerText || "").trim();
    function flash(t) { b.textContent = t; setTimeout(function() { b.textContent = label; }, 1500); }
    if (!txt) { flash("会話がありません"); return; }
    copyToClipboard(txt).then(function() { flash("コピーしました"); })
      .catch(function(err) { flash("コピー失敗"); });
  });

  els.btnClearLog.addEventListener("click", function() {
    clearLogBox(els.chatLog, "実行結果がここに表示されます。");
  });

  els.btnUseHist.addEventListener("click", function() {
    if (state.selectedHistIdx >= 0 && state.history[state.selectedHistIdx] !== undefined) {
      els.askInput.value = state.history[state.selectedHistIdx];
      updatePreview();
      els.askInput.focus();
    }
  });
  els.btnRerunHist.addEventListener("click", function() {
    if (state.selectedHistIdx >= 0 && state.history[state.selectedHistIdx] !== undefined) {
      els.askInput.value = state.history[state.selectedHistIdx];
      updatePreview();
      onRunAsk();
    }
  });

  els.cfgAiMode.addEventListener("change", updateApiKeyPlaceholder);
  els.btnSaveConfig.addEventListener("click", onSaveConfig);
  els.btnCheckPostbox.addEventListener("click", onCheckPostbox);

  els.btnNewTalk.addEventListener("click", function() {
    els.askInput.value = "";
    updatePreview();
    clearLogBox(els.chatLog, "実行結果がここに表示されます。");
    switchTab("auto");
    els.askInput.focus();
  });
  els.btnUndo.addEventListener("click", onUndo);
  els.btnQuickRun.addEventListener("click", function() {
    var it = state.quick.items[state.quick.sel];
    if (it) { quickRunItem(it); return; }
    if (!quickRunFromInput() && (els.askInput.value || "").trim()) onRunAsk();
  });
  els.btnQuickReload.addEventListener("click", function() { loadQuickList(); });
  els.btnQuickEdit.addEventListener("click", function() {
    var q = state.quick, it = q.items[q.sel];
    if (it && it.src === "sheet") {
      els.quickNote.textContent = "シートのマクロは メニューの「拡張機能 → Apps Script」で開いて直してください";
      return;
    }
    if (q.myUrl) { window.open(q.myUrl, "_blank"); return; }
    runServerAction({
      fnName: "comboQuickMake", payload: {}, label: "マイマクロを作る", statusText: "マイマクロを作っています…", switchToChat: false,
      onSuccess: function(res) {
        q.myId = res.myId || ""; q.myUrl = res.myUrl || "";
        els.quickNote.textContent = (res.text || "") + "。「編集」で開いて、エディタの Gemini に作ってもらえます";
        loadQuickList();
      }
    });
  });
  // 「マイマクロへ」を押す → 写したいシートのマクロを押す（撃たずに写す）。もう一度押すとやめる
  function setQuickImportMode(on) {
    state.quick.importMode = !!on;
    els.quickNote.textContent = on ? "マイマクロへ写したい「シート」のマクロを押してください（撃ちません）" : "";
    renderQuickList();
  }
  els.btnQuickImport.addEventListener("click", function() { setQuickImportMode(!state.quick.importMode); });
  function quickImportItem(it) {
    runServerAction({
      fnName: "comboQuickImport", payload: { name: it.name }, label: "マイマクロへ " + it.name, statusText: "マイマクロへ写しています…", switchToChat: false,
      onSuccess: function(res) { els.quickNote.textContent = res.text || "写しました"; loadQuickList(); }
    });
  }
  els.btnReload.addEventListener("click", function() { onInit(true); });

  document.addEventListener("visibilitychange", function() {
    if (!document.hidden && Object.keys(state.pendingPostboxIds).length > 0) {
      schedulePoll(300);
    }
  });

  // ---- 初期起動 ----
  if (hasGasBridge()) {
    quickRestoreList();
    loadQuickList();
    runServerAction({
      fnName: "comboInit",
      payload: { targetId: "", sheet: "", assumeActive: true },
      label: "初期化 / 再読込",
      statusText: "読込中…",
      switchToChat: false,
      silentSuccess: true,
      onSuccess: function(res) {
        if (res.postboxDone) handlePostboxDone(res.postboxDone);
        loadLearned();
        if (!res.config) {
          callGas("comboGetConfig", undefined, function(cfg) { applyConfig(cfg); });
        }
      }
    });
  } else {
    els.targetNameLabel.textContent = "プレビュー";
    els.infoLabel.textContent = "対象: GAS サイドバー環境で自動接続されます";
    updateSelectionLabel();
    updatePreview();
  }
  if (typeof globalThis !== "undefined") {
    globalThis.__comboDirectTest = {
      state: state,
      els: els,
      buildDirectBatchUpdate: buildDirectBatchUpdate
    };
  }
})();
</script>
