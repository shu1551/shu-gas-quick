          requests.push({ updateBorders: bReq });
          undoRequests.unshift({
            updateCells: {
              range: parsedRg.gridRange,
              rows: bRows,
              fields: "userEnteredFormat.borders"
            }
          });
          // 罫線は写しに書き足せないので、書いた後・戻した後に写しを取り直す（次の取り消しが古い罫線で戻さないように）
          snapshotMutators.push(function() { prefetchSheetSnapshot(sheetName); });
          undoSnapshotMutators.push(function() { prefetchSheetSnapshot(sheetName); });
          did.push("borders");
        }

        if (op.merge !== undefined) {
          if (op.merge) {
            requests.push({ mergeCells: { range: parsedRg.gridRange, mergeType: "MERGE_ALL" } });
            undoRequests.unshift({ unmergeCells: { range: parsedRg.gridRange } });
            did.push("merge");
          } else {
            requests.push({ unmergeCells: { range: parsedRg.gridRange } });
            undoRequests.unshift({ mergeCells: { range: parsedRg.gridRange, mergeType: "MERGE_ALL" } });
            did.push("unmerge");
          }
        }

        if (!did.length) return null;

        changed.push(sheetName + "!" + parsedRg.a1 + " " + did.join("・"));
        whatList.push(parsedRg.a1 + (bgClear ? "（bg.clear）" : "（format）"));
      } else if (op.shelf === "freeze" || op.shelf === "unfreeze") {
        var fRows = op.shelf === "unfreeze" ? 0 : (op.rows !== undefined ? Number(op.rows) : ((state.table && state.table.header_row) || 1));
        var fCols = op.shelf === "unfreeze" ? 0 : (op.cols !== undefined ? Number(op.cols) : 0);
        requests.push({
          updateSheetProperties: {
            properties: {
              sheetId: sheetId,
              gridProperties: { frozenRowCount: fRows, frozenColumnCount: fCols }
            },
            fields: "gridProperties.frozenRowCount,gridProperties.frozenColumnCount"
          }
        });
        var snapF = state.sheetSnapshot[sheetName] || { frozenRows: 0, frozenCols: 0 };
        undoRequests.unshift({
          updateSheetProperties: {
            properties: {
              sheetId: sheetId,
              gridProperties: { frozenRowCount: snapF.frozenRows || 0, frozenColumnCount: snapF.frozenCols || 0 }
            },
            fields: "gridProperties.frozenRowCount,gridProperties.frozenColumnCount"
          }
        });
        changed.push(sheetName + "!" + (op.shelf === "unfreeze" ? "固定解除" : ("固定 " + fRows + "行")));
        whatList.push(op.shelf);
      } else if (op.shelf === "width") {
        var wDid = [];
        if (op.cols && typeof op.cols === "object") {
          var ckList = Object.keys(op.cols);
          for (var cki = 0; cki < ckList.length; cki++) {
            var cLetter = resolveColLetterFromTable(ckList[cki]);
            var cIdx = colToNum0(cLetter);
            if (cIdx < 0) return null;
            requests.push({
              updateDimensionProperties: {
                range: { sheetId: sheetId, dimension: "COLUMNS", startIndex: cIdx, endIndex: cIdx + 1 },
                properties: { pixelSize: Number(op.cols[ckList[cki]]) },
                fields: "pixelSize"
              }
            });
            wDid.push(ckList[cki] + "列");
          }
        }
        if (op.col && op.width) {
          var singleCol = resolveColLetterFromTable(op.col);
          var singleIdx = colToNum0(singleCol);
          if (singleIdx < 0) return null;
          requests.push({
            updateDimensionProperties: {
              range: { sheetId: sheetId, dimension: "COLUMNS", startIndex: singleIdx, endIndex: singleIdx + 1 },
              properties: { pixelSize: Number(op.width) },
              fields: "pixelSize"
            }
          });
          wDid.push(op.col + "列");
        }
        if (op.rows && typeof op.rows === "object") {
          var rkList = Object.keys(op.rows);
          for (var rki = 0; rki < rkList.length; rki++) {
            var rIdx = parseInt(rkList[rki], 10) - 1;
            if (isNaN(rIdx) || rIdx < 0) return null;
            requests.push({
              updateDimensionProperties: {
                range: { sheetId: sheetId, dimension: "ROWS", startIndex: rIdx, endIndex: rIdx + 1 },
                properties: { pixelSize: Number(op.rows[rkList[rki]]) },
                fields: "pixelSize"
              }
            });
            wDid.push(rkList[rki] + "行");
          }
        }
        if (Array.isArray(op.auto) && op.auto.length) {
          for (var ai = 0; ai < op.auto.length; ai++) {
            var autoCol = resolveColLetterFromTable(op.auto[ai]);
            var autoIdx = colToNum0(autoCol);
            if (autoIdx < 0) return null;
            requests.push({
              autoResizeDimensions: {
                dimensions: { sheetId: sheetId, dimension: "COLUMNS", startIndex: autoIdx, endIndex: autoIdx + 1 }
              }
            });
            wDid.push(op.auto[ai] + "列(自動)");
          }
        }
        if (!wDid.length) return null;
        changed.push(sheetName + "!" + wDid.join("・") + " 幅・高さを変更");
        whatList.push("width");
      } else if (op.shelf === "clear.format" || op.shelf === "clear.values" || op.shelf === "clear.all") {
        if (op.shelf !== "clear.format" && (!els.chkOk || !els.chkOk.checked)) return null;
        if (op.shelf === "clear.values" && op.only === "constants") return null;
        var clRg = parseSimpleA1Range(String(op.range || ""), sheetId);
        if (!clRg) return null;
        if (op.shelf === "clear.format") {
          requests.push({ repeatCell: { range: clRg.gridRange, cell: {}, fields: "userEnteredFormat" } });
          changed.push(sheetName + "!" + clRg.a1 + " 書式クリア");
        } else if (op.shelf === "clear.values") {
          requests.push({ updateCells: { range: clRg.gridRange, fields: "userEnteredValue" } });
          changed.push(sheetName + "!" + clRg.a1 + " 値クリア");
        } else {
          requests.push({ updateCells: { range: clRg.gridRange, fields: "userEnteredValue,userEnteredFormat" } });
          changed.push(sheetName + "!" + clRg.a1 + " すべてクリア");
        }
        whatList.push(op.shelf);
      } else if (op.shelf === "write") {
        if (op.tsv !== undefined || !op.cells || typeof op.cells !== "object" || Array.isArray(op.cells)) return null;
        var wKeys = Object.keys(op.cells);
        if (!wKeys.length) return null;
        // 書く前の値が写しで分かるセルだけ直結で書く。空でないセルの上書きは GAS の道（上書きの止め・控えあり）に任せる
        var wSnap = state.sheetSnapshot[sheetName];
        if (!wSnap || !wSnap.vals) return null;
        for (var wi = 0; wi < wKeys.length; wi++) {
          var cellRg = parseSimpleA1Range(wKeys[wi], sheetId);
          if (!cellRg || cellRg.r1 !== cellRg.r2 || cellRg.c1 !== cellRg.c2) return null;
          if (cellRg.r1 > 29 || cellRg.c1 > 25) return null;
          var wPrev = wSnap.vals[cellRg.a1];
          if (wPrev && !(els.chkOk && els.chkOk.checked)) return null;
          undoRequests.unshift({
            updateCells: {
              start: { sheetId: sheetId, rowIndex: cellRg.r1, columnIndex: cellRg.c1 },
              rows: [{ values: [wPrev ? { userEnteredValue: wPrev } : {}] }],
              fields: "userEnteredValue"
            }
          });
          (function(key, newV, oldV) {
            snapshotMutators.push(function() { var sn = state.sheetSnapshot[sheetName]; if (sn && sn.vals) sn.vals[key] = newV; });
            undoSnapshotMutators.push(function() { var sn = state.sheetSnapshot[sheetName]; if (sn && sn.vals) { if (oldV) sn.vals[key] = oldV; else delete sn.vals[key]; } });
          })(cellRg.a1, toUserEnteredValue(op.cells[wKeys[wi]]), wPrev);
          requests.push({
            updateCells: {
              start: { sheetId: sheetId, rowIndex: cellRg.r1, columnIndex: cellRg.c1 },
              rows: [{ values: [{ userEnteredValue: toUserEnteredValue(op.cells[wKeys[wi]]) }] }],
              fields: "userEnteredValue"
            }
          });
        }
        changed.push(sheetName + "!" + wKeys.slice(0, 3).join(",") + (wKeys.length > 3 ? "…" : "") + " 書き込み");
        whatList.push("write");
      } else if (op.shelf === "filter.off") {
        requests.push({ clearBasicFilter: { sheetId: sheetId } });
        changed.push(sheetName + " フィルター解除");
        whatList.push("filter.off");
      } else if (op.shelf === "filter.on") {
        var fA1 = op.range ? String(op.range) : resolveTableRangeStr(true);
        var fRg = parseSimpleA1Range(fA1, sheetId);
        if (!fRg) return null;
        requests.push({ setBasicFilter: { filter: { range: fRg.gridRange } } });
        undoRequests.unshift({ clearBasicFilter: { sheetId: sheetId } });
        changed.push(sheetName + "!" + fRg.a1 + " フィルター設定");
        whatList.push("filter.on");
      } else if (op.shelf === "sort") {
        if (op.where || op.filter || !op.col) return null;
        var sortColLetter = resolveColLetterFromTable(op.col);
        var sortColIdx = colToNum0(sortColLetter);
        if (sortColIdx < 0) return null;
        var sA1 = op.range ? String(op.range) : resolveTableRangeStr(false);
        var sRg = parseSimpleA1Range(sA1, sheetId);
        if (!sRg) return null;
        requests.push({
          sortRange: {
            range: sRg.gridRange,
            sortSpecs: [{ dimensionIndex: sortColIdx, sortOrder: op.desc ? "DESCENDING" : "ASCENDING" }]
          }
        });
        changed.push(sheetName + "!" + sRg.a1 + " " + op.col + "列で" + (op.desc ? "降順" : "昇順") + "並べ替え");
        whatList.push("sort");
      } else if (op.shelf === "banding.add" || op.shelf === "banding.remove") {
        var bSnap = state.sheetSnapshot[sheetName];
        if (!bSnap || !Array.isArray(bSnap.bandedRangeIds)) return null;
        var oldBandIds = bSnap.bandedRangeIds.slice();
        if (op.shelf === "banding.remove" && !oldBandIds.length) return null;
        for (var bdi = 0; bdi < oldBandIds.length; bdi++) {
          requests.push({ deleteBanding: { bandedRangeId: oldBandIds[bdi] } });
        }
        if (op.shelf === "banding.add") {
          var bA1 = op.range ? String(op.range) : resolveTableRangeStr(true);
          var bRg = parseSimpleA1Range(bA1, sheetId);
          if (!bRg) return null;
          var themeKey = String(op.theme || "gray").toLowerCase();
          var pal = BANDING_THEMES[themeKey] || BANDING_THEMES.gray;
          var addReqIdx = requests.length;
          requests.push({
            addBanding: {
              bandedRange: {
                range: bRg.gridRange,
                rowProperties: {
                  headerColorStyle: { rgbColor: parseColorToRgbObj(pal.header) },
                  firstBandColorStyle: { rgbColor: parseColorToRgbObj(pal.first) },
                  secondBandColorStyle: { rgbColor: parseColorToRgbObj(pal.second) }
                }
              }
            }
          });
          (function(rIdx, sName) {
            snapshotMutators.push(function(resJson) {
              var sp = state.sheetSnapshot[sName];
              if (!sp) return;
              var newIds = [];
              if (resJson && Array.isArray(resJson.replies) && resJson.replies[rIdx] &&
                  resJson.replies[rIdx].addBanding && resJson.replies[rIdx].addBanding.bandedRange) {
                newIds.push(resJson.replies[rIdx].addBanding.bandedRange.bandedRangeId);
              }
              sp.bandedRangeIds = newIds;
            });
          })(addReqIdx, sheetName);
          changed.push(sheetName + "!" + bRg.a1 + " 交互背景色(" + themeKey + ")");
        } else {
          (function(sName) {
            snapshotMutators.push(function() {
              if (state.sheetSnapshot[sName]) state.sheetSnapshot[sName].bandedRangeIds = [];
            });
          })(sheetName);
          changed.push(sheetName + " 交互背景色解除");
        }
        whatList.push(op.shelf);
      } else if (op.shelf === "sheet.color") {
        var tcName = op.name || sheetName;
        var tcSid = state.sheetIdMap[tcName];
        if (typeof tcSid !== "number") return null;
        var isClearTab = (op.color === undefined || op.color === null || op.color === "" ||
          op.color === "なし" || /^(none|clear)$/i.test(String(op.color).trim()));
        var tabStyle = null;
        if (!isClearTab) {
          var tcRgb = parseColorToRgbObj(op.color);
          if (!tcRgb) return null;
          tabStyle = { rgbColor: tcRgb };
        }
        requests.push({
          updateSheetProperties: {
            properties: { sheetId: tcSid, tabColorStyle: tabStyle },
            fields: "tabColorStyle"
          }
        });
        changed.push(tcName + " タブ色" + (isClearTab ? "解除" : "変更"));
        whatList.push("sheet.color");
      } else if (op.shelf === "sheet.rename") {
        if (!op.to) return null;
        var rnOld = op.name || sheetName;
        var rnNew = String(op.to).trim();
        var rnSid = state.sheetIdMap[rnOld];
        if (!rnNew || typeof rnSid !== "number") return null;
        requests.push({
          updateSheetProperties: {
            properties: { sheetId: rnSid, title: rnNew },
            fields: "title"
          }
        });
        undoRequests.unshift({
          updateSheetProperties: {
            properties: { sheetId: rnSid, title: rnOld },
            fields: "title"
          }
        });
        (function(oName, nName, sid) {
          snapshotMutators.push(function() {
            delete state.sheetIdMap[oName];
            state.sheetIdMap[nName] = sid;
            if (Array.isArray(state.sheets)) {
              for (var si = 0; si < state.sheets.length; si++) {
                if (state.sheets[si] === oName) state.sheets[si] = nName;
              }
            }
            if (state.curSheet === oName) state.curSheet = nName;
            if (state.target && state.target.sheet === oName) state.target.sheet = nName;
            if (state.sheetSnapshot[oName]) {
              state.sheetSnapshot[nName] = state.sheetSnapshot[oName];
              delete state.sheetSnapshot[oName];
            }
          });
          undoSnapshotMutators.push(function() {
            delete state.sheetIdMap[nName];
            state.sheetIdMap[oName] = sid;
            if (Array.isArray(state.sheets)) {
              for (var si = 0; si < state.sheets.length; si++) {
                if (state.sheets[si] === nName) state.sheets[si] = oName;
              }
            }
            if (state.curSheet === nName) state.curSheet = oName;
            if (state.target && state.target.sheet === nName) state.target.sheet = oName;
            if (state.sheetSnapshot[nName]) {
              state.sheetSnapshot[oName] = state.sheetSnapshot[nName];
              delete state.sheetSnapshot[nName];
            }
          });
        })(rnOld, rnNew, rnSid);
        changed.push(rnOld + " → " + rnNew + " シート名変更");
        whatList.push("sheet.rename");
      } else if (op.shelf === "sheet.hide") {
        var hName = op.name || sheetName;
        var hSid = state.sheetIdMap[hName];
        if (typeof hSid !== "number" || !Array.isArray(state.sheets) || state.sheets.length <= 1) return null;
        requests.push({
          updateSheetProperties: {
            properties: { sheetId: hSid, hidden: true },
            fields: "hidden"
          }
        });
        undoRequests.unshift({
          updateSheetProperties: {
            properties: { sheetId: hSid, hidden: false },
            fields: "hidden"
          }
        });
        changed.push(hName + " 非表示");
        whatList.push("sheet.hide");
      } else if (op.shelf === "sheet.show") {
        if (!op.name) return null;
        var shSid = state.sheetIdMap[op.name];
        if (typeof shSid !== "number") return null;
        requests.push({
          updateSheetProperties: {
            properties: { sheetId: shSid, hidden: false },
            fields: "hidden"
          }
        });
        undoRequests.unshift({
          updateSheetProperties: {
            properties: { sheetId: shSid, hidden: true },
            fields: "hidden"
          }
        });
        changed.push(op.name + " 再表示");
        whatList.push("sheet.show");
      } else if (op.shelf === "api") {
        if (!els.chkOk || !els.chkOk.checked) return null;
        if (!Array.isArray(op.requests) || !op.requests.length) return null;
        for (var apiIdx = 0; apiIdx < op.requests.length; apiIdx++) {
          requests.push(op.requests[apiIdx]);
        }
        changed.push(sheetName + " API直接操作(" + op.requests.length + "件)");
        whatList.push("api");
      } else {
        return null;
      }
    }

    if (!requests.length) return null;
    return {
      requests: requests,
      undoRequests: undoRequests,
      changed: changed,
      what: whatList.join("・"),
      applySnapshot: function(resJson) {
        for (var m = 0; m < snapshotMutators.length; m++) snapshotMutators[m](resJson);
      },
      restoreSnapshot: function() {
        for (var u = undoSnapshotMutators.length - 1; u >= 0; u--) undoSnapshotMutators[u]();
      }
    };
  }

  function tryDirectSheetsApi(ops, label, isFromAsk, fallbackFn, retried, opts) {
    if (typeof fetch !== "function") return false;
    var switchChat = !(opts && opts.switchToChat === false);
    var sheetName = state.curSheet || (state.target && state.target.sheet) || "";
    var plan = buildDirectBatchUpdate(ops, sheetName);
    if (!plan) {
      // 直結の道に乗れなかった理由が写しの失敗なら、会話の欄に 1 回だけ出す（黙って遅い道に回らない）
      if (state.prefetchError && !state.prefetchErrorShown) {
        state.prefetchErrorShown = true;
        appendLog(els.chatLog, "is-err", "⚠ 直結の道（0.3 秒）が使えません", state.prefetchError + "（GAS の道で撃ちます）");
      }
      return false;
    }

    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return true;
    }
    setBusy(true, "実行中…");
    if (switchChat) switchTab("chat");

    var t0 = performance.now();
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id) + ":batchUpdate";
    fetch(url, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.oauthToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ requests: plan.requests })
    })
      .then(function(res) {
        if (!res.ok) {
          var e = new Error("HTTP " + res.status);
          e.status = res.status;
          throw e;
        }
        return res.json();
      })
      .then(function(resJson) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        plan.applySnapshot(resJson);
        if (plan.undoRequests && plan.undoRequests.length) {
          state.directUndoStack.push({
            sheet: sheetName,
            what: plan.what || "format",
            requests: plan.undoRequests,
            restoreSnapshot: plan.restoreSnapshot
          });
        }
        var lines = [];
        if (isFromAsk) {
          lines.push("[棚ヒット] " + formatOpsShort(ops));
        }
        lines.push("対象: " + (state.target.name || "(名前なし)") + " › " + sheetName);
        lines.push("直した所: " + plan.changed.slice(0, 2).join(" ／ "));
        lines.push("控えなし（backup=OFF）");
        checkNewErrorsAfterDirect(sheetName, ops, function(news) {
          if (news.length) lines.push("⚠ 新しいエラー: " + news.slice(0, 5).join("・") + (news.length > 5 ? " ほか " + (news.length - 5) + " 件" : "") + "（直前を取り消すで戻せます）");
          recordExecution(true, label, lines.join("\n"), wallMs, 0, switchChat, true);
        });
        if (!switchChat) {
          var noteHead = (plan.changed && plan.changed.length)
            ? (label + ": " + plan.changed.slice(0, 3).join(" / ") + (plan.changed.length > 3 ? " …" : ""))
            : (label + " を実行しました");
          els.quickNote.textContent = noteHead + "（" + (Math.max(0, wallMs / 1000)).toFixed(2) + "s・直接API）";
        }
        if (state.oauthTokenAt && (Date.now() - state.oauthTokenAt > 3000000)) {
          setTimeout(function() { quickCheckBuild(true); }, 0);
        }
      })
      .catch(function(err) {
        if (err && err.status === 401 && !retried && hasGasBridge()) {
          callGas("comboQuickBuild", {}, function(rb) {
            setBusy(false);
            if (rb && rb.oauthToken) {
              state.oauthToken = rb.oauthToken;
              state.oauthTokenAt = Date.now();
              tryDirectSheetsApi(ops, label, isFromAsk, fallbackFn, true, opts);
            } else if (fallbackFn) {
              fallbackFn();
            }
          }, function() {
            setBusy(false);
            if (fallbackFn) fallbackFn();
          });
          return;
        }
        setBusy(false);
        if (fallbackFn) fallbackFn();
      });
    return true;
  }

  function tryDirectUndo(fallbackFn, retried, retryItem) {
    if (typeof fetch !== "function" || !state.oauthToken || !state.target.id || (!retryItem && !state.directUndoStack.length)) {
      return false;
    }
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return true;
    }
    var item = retryItem || state.directUndoStack.pop();
    setBusy(true, "取り消し中…");
    switchTab("chat");

    var t0 = performance.now();
    var url = "https://sheets.googleapis.com/v4/spreadsheets/" + encodeURIComponent(state.target.id) + ":batchUpdate";
    fetch(url, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.oauthToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ requests: item.requests })
    })
      .then(function(res) {
        if (!res.ok) {
          var e = new Error("HTTP " + res.status);
          e.status = res.status;
          throw e;
        }
        return res.json();
      })
      .then(function() {
        var wallMs = performance.now() - t0;
        setBusy(false);
        if (item.restoreSnapshot) item.restoreSnapshot();
        var body = [
          "対象: " + (state.target.name || "(名前なし)") + " › " + item.sheet,
          "戻した: " + item.what + " を取り消しました（直接API戻し）"
        ].join("\n");
        recordExecution(true, "直前を取り消す", body, wallMs, 0, true, true);
      })
      .catch(function(err) {
        if (err && err.status === 401 && !retried && hasGasBridge()) {
          callGas("comboQuickBuild", {}, function(rb) {
            setBusy(false);
            if (rb && rb.oauthToken) {
              state.oauthToken = rb.oauthToken;
              state.oauthTokenAt = Date.now();
              tryDirectUndo(fallbackFn, true, item);
            } else if (fallbackFn) {
              fallbackFn();
            }
          }, function() {
            setBusy(false);
            if (fallbackFn) fallbackFn();
          });
          return;
        }
        setBusy(false);
        if (fallbackFn) fallbackFn();
      });
    return true;
  }

  // ---- アクション実行 ----
  function runServerAction(opts) {
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return;
    }
    var switchChat = opts.switchToChat !== false;
    setBusy(true, opts.statusText || "実行中…");
    if (switchChat) switchTab("chat");

    var t0 = performance.now();
    callGas(
      opts.fnName,
      opts.payload,
      function(res) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        setTimeout(function() { quickCheckBuild(false); }, 0);

        if (!res || res.ok === false) {
          var errMsg = (res && (res.text || res.error)) || "実行に失敗しました";
          if (res && res.needs_ok && errMsg.indexOf("確認なし") === -1) {
            errMsg += "\n（「確認なし」にチェックを入れて再実行してください）";
          }
          recordExecution(false, opts.label, errMsg, wallMs, res && res.gasMs, true);
          return;
        }

        if (opts.onSuccess) opts.onSuccess(res, wallMs);
        applyServerState(res);

        if (!opts.silentSuccess) {
          recordExecution(true, opts.label, res.text || "完了", wallMs, res.gasMs, switchChat);
        }
      },
      function(err) {
        var wallMs = performance.now() - t0;
        setBusy(false);
        recordExecution(false, opts.label, formatError(err), wallMs, undefined, true);
      }
    );
  }

  function onInit(silent) {
    runServerAction({
      fnName: "comboInit",
      payload: {
        targetId: state.target.id || "",
        sheet: state.curSheet || "",
        assumeActive: true
      },
      label: "初期化 / 再読込",
      statusText: "読込中…",
      switchToChat: false,
      silentSuccess: !!silent,
      onSuccess: function(res) {
        if (!res || !res.learned) loadLearned();
      }
    });
  }

  function onLook(sheetOverride) {
    var targetSheet = (typeof sheetOverride === "string") ? sheetOverride : (els.sheetSelect.value || state.curSheet || "");
    runServerAction({
      fnName: "comboLook",
      payload: {
        targetId: state.target.id || "",
        sheet: targetSheet,
        assumeActive: true
      },
      label: "読込 (comboLook)",
      statusText: "読込中…",
      switchToChat: false
    });
  }

  function hasSelectionPronoun(txt) {
    return /(ここ|このセル|選択範囲|選択セル|この行|この列|この範囲|今のセル)/.test(txt || "");
  }

  function onRunAsk() {
    var txt = (els.askInput.value || "").trim();
    if (!txt) return;
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return;
    }
    // 「選択セル」「この」等、今選んでいる所を指す頼みは、先に選んでいる所を読み直してから棚に当てる
    // （GASクイックの大元はサーバー側で棚を当てないので、サーバーへ回すと撃てない）
    if (els.chkSync.checked && hasSelectionPronoun(txt) && !state.liveSelDone) {
      setBusy(true, "選んでいる所を読んでいます…");
      var again = function() {
        setBusy(false);
        state.liveSelDone = true;
        try { onRunAsk(); } finally { state.liveSelDone = false; }
      };
      callGas("comboPollSelection", { targetId: state.target.id || "", sheet: "" },
        function(res) { if (res && res.ok) applyServerState(res); again(); }, again);
      return;
    }
    pushHistory(txt);

    var liveSelPrompt = !state.liveSelDone && !!(els.chkSync.checked && hasSelectionPronoun(txt));
    var planRes = updatePreview();
    var fireOps = (!liveSelPrompt && planRes && planRes.fire && Array.isArray(planRes.ops) && planRes.ops.length) ? planRes.ops : null;

    els.askInput.value = "";
    updatePreview();

    var suggestOps = (!fireOps && !liveSelPrompt && planRes && Array.isArray(planRes.suggest) && planRes.suggest.length) ? planRes.suggest : null;

    var statusText = "実行中…";
    var payload = {
      ask: txt,
      ops: fireOps,
      ok: !!els.chkOk.checked,
      backup: !!els.chkBackup.checked,
      assumeActive: true,
      targetId: state.target.id || "",
      targetName: state.target.name || "",
      sheets: state.sheets || [],
      sheet: liveSelPrompt ? "" : (state.curSheet || ""),
      table: state.table
    };
    if (!liveSelPrompt) {
      payload.selection = els.chkSync.checked ? (state.selection || "") : "";
    }
    if (suggestOps) {
      offerSuggest(txt, suggestOps, null);
      return;
    }
    if (fireOps && !liveSelPrompt && !els.chkBackup.checked) {
      var handledDirect = tryDirectSheetsApi(fireOps, txt, true, function() {
        runServerAction({
          fnName: "comboRunAsk",
          payload: payload,
          label: txt,
          statusText: statusText,
          switchToChat: true
        });
      });
      if (handledDirect) return;
    }

    state.directUndoStack = [];
    runServerAction({
      fnName: "comboRunAsk",
      payload: payload,
      label: txt,
      statusText: statusText,
      switchToChat: true
    });
  }

  // ===== GASクイック: 直したら自分で開き直す =====
  // 組み立てのときに quick.py がこの操作窓の版の印を埋める。大元の印と違えば、新しい操作窓に入れ替える
  var QUICK_SIDEBAR_BUILD = "";
  var quickBuildAt = 0;
  function quickCheckBuild(force) {
    if (!QUICK_SIDEBAR_BUILD || !hasGasBridge()) return;
    var now = Date.now();
    if (!force && now - quickBuildAt < 60000) return;
    quickBuildAt = now;
    callGas("comboQuickBuild", {}, function(res) {
      if (res && res.ok && res.oauthToken) {
        state.oauthToken = res.oauthToken;
        state.oauthTokenAt = Date.now();
      }
      if (res && res.ok && res.build && res.build !== QUICK_SIDEBAR_BUILD && !state.busy) {
        els.quickNote.textContent = "新しい版に入れ替えています…";
        callGas("comboQuickReopen", { draft: els.askInput.value || "" });
      }
    });
  }
  var quickSheetSyncAt = 0;
  function quickSyncSheetOnFocus() {
    if (!hasGasBridge() || state.busy || !state.target || !state.target.id) return;
    var now = Date.now();
    if (now - quickSheetSyncAt < 5000) return;
    quickSheetSyncAt = now;
    callGas("comboPollSelection", { targetId: state.target.id || "", sheet: "" }, function(res) {
      if (!res || !res.ok) return;
      var prevSheet = state.curSheet || "";
      applyServerState(res);
      if (res.sheet && prevSheet && res.sheet !== prevSheet && !state.busy) {
        onLook(res.sheet);
      }
    }, function() {});
  }
  window.addEventListener("focus", function() { quickCheckBuild(false); quickSyncSheetOnFocus(); });
  document.addEventListener("visibilitychange", function() { if (!document.hidden) { quickCheckBuild(false); quickSyncSheetOnFocus(); } });

  // ===== GASクイック: 一覧 =====
  function quickShelfItems() {
    var shelves = (typeof COMBO_CATALOG_DATA !== "undefined" && COMBO_CATALOG_DATA.shelves) || [];
    return shelves.filter(function(sh) { return sh.searchable !== false && sh.kind !== "doc"; }).map(function(sh) {
      var needArgs = (sh.args || []).some(function(a) { return a.req; });
      var ex = (Array.isArray(sh.examples) && sh.examples.length && Array.isArray(sh.examples[0]) && sh.examples[0][0])
        ? String(sh.examples[0][0]) : "";
      return { src: "shelf", name: sh.name, label: sh.title || sh.name, words: sh.words || [], desc: "", example: ex, needArgs: needArgs };
    });
  }

  function quickOrdered(list, order) {
    var pos = {};
    (order || []).forEach(function(n, i) { pos[n] = i; });
    return list.map(function(it, i) { return { it: it, i: i }; }).sort(function(a, b) {
      // 覚えに無い物（新しく足した物）は、区切りの一番上に、コードの順で並べる
      var pa = pos.hasOwnProperty(a.it.name) ? pos[a.it.name] : -100000 + a.i;
      var pb = pos.hasOwnProperty(b.it.name) ? pos[b.it.name] : -100000 + b.i;
      return pa - pb;
    }).map(function(x) { return x.it; });
  }

  function quickAllItems() {
    var q = state.quick, sheet = [], my = [];
    (q.sheet || []).forEach(function(f) { sheet.push({ src: "sheet", name: f.name, label: f.name, words: f.words || [], desc: f.desc || "", steps: Array.isArray(f.steps) ? f.steps : [] }); });
    (q.my || []).forEach(function(f) { my.push({ src: "my", name: f.name, label: f.name, words: f.words || [], desc: f.desc || "", steps: Array.isArray(f.steps) ? f.steps : [] }); });
    return quickOrdered(sheet, q.order.sheet).concat(quickOrdered(my, q.order.my), quickOrdered(quickShelfItems(), q.order.shelf));
  }

  function quickItemTip(it) {
    if (!it) return "";
    if (it.steps && it.steps.length) {
      var st = "⚡ 手順: " + it.steps.join(" / ");
      return it.desc ? (it.desc + " — " + st) : st;
    }
    if (it.desc) return it.desc;
    if (it.src === "shelf") return it.example ? ("棚: " + it.name + "（例: " + it.example + "）") : ("棚: " + it.name);
    return it.label;
  }

  // ===== 並べ替え（区切りの中だけ） =====
  var quickSaveTimer = {};
  function quickMove(dir) {
    var q = state.quick, items = q.items || [], it = items[q.sel];
    if (!it || (els.askInput.value || "").trim()) return;
    var j = q.sel + dir, other = items[j];
    if (!other || other.src !== it.src) return;
    var group = items.filter(function(x) { return x.src === it.src; }).map(function(x) { return x.name; });
    var a = group.indexOf(it.name), b = group.indexOf(other.name);
    group[a] = other.name; group[b] = it.name;
    q.order[it.src] = group;
    q.sel = j;
    renderQuickList();
    var row = els.quickList.querySelectorAll(".quick-item")[j];
    if (row && row.scrollIntoView) row.scrollIntoView({ block: "nearest" });
    if (it.src !== "sheet") quickRememberLocal();
    clearTimeout(quickSaveTimer[it.src]);
    quickSaveTimer[it.src] = setTimeout(function() {
      callGas("comboQuickSaveOrder", { kind: it.src, names: group });
    }, 700);
  }

  function quickPinKey(it) { return it ? (it.src + ":" + it.name) : ""; }
  function quickIsPinned(it) { return !!(it && state.quick.pins && state.quick.pins[quickPinKey(it)]); }
  function quickTogglePin(it) {
    if (!it) return;
    var k = quickPinKey(it);
    if (!state.quick.pins) state.quick.pins = {};
    if (state.quick.pins[k]) delete state.quick.pins[k];
    else state.quick.pins[k] = 1;
    quickRememberLocal();
    renderQuickList();
  }

  function quickMoveButtons(idx) {
    var items = state.quick.items || [], it = items[idx];
    var box = document.createElement("span");
    box.className = "quick-move";
    var pinBtn = document.createElement("button");
    pinBtn.type = "button";
    var pinned = quickIsPinned(it);
    pinBtn.textContent = pinned ? "★" : "☆";
    pinBtn.title = pinned ? "ピン留めを外す" : "ピン留め（★）";
    if (pinned) pinBtn.className = "is-pinned";
    pinBtn.addEventListener("click", function(e) { e.stopPropagation(); quickTogglePin(it); });
    pinBtn.addEventListener("dblclick", function(e) { e.stopPropagation(); });
    box.appendChild(pinBtn);
    var filtering = !!(els.askInput.value || "").trim() || state.quick.filter !== "all";
    [["▲", -1], ["▼", 1]].forEach(function(d) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = d[0];
      b.title = d[1] < 0 ? "上へ（Alt+↑）" : "下へ（Alt+↓）";
      var nb = items[idx + d[1]];
      b.disabled = filtering || !nb || nb.src !== it.src;
      b.addEventListener("click", function(e) { e.stopPropagation(); quickMove(d[1]); });
      b.addEventListener("dblclick", function(e) { e.stopPropagation(); });
      box.appendChild(b);
    });
    return box;
  }

  document.addEventListener("keydown", function(e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (state.activeTab !== "list") return;
    if (e.altKey && state.quick.sel >= 0) {
      if (e.key === "ArrowUp" || e.key === "ArrowDown") {
        e.preventDefault();
        quickMove(e.key === "ArrowUp" ? -1 : 1);
      }
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)) return;
    var items = state.quick.items || [];
    if (e.key === "ArrowDown" && items.length) {
      e.preventDefault();
      quickSelectIdx(state.quick.sel < 0 ? 0 : Math.min(items.length - 1, state.quick.sel + 1));
    } else if (e.key === "ArrowUp" && state.quick.sel >= 0 && items.length) {
      e.preventDefault();
      quickSelectIdx(state.quick.sel - 1);
    } else if (e.key === "Escape" && state.quick.sel >= 0) {
      e.preventDefault();
      quickSelectIdx(-1);
    } else if (e.key === "Enter" && state.quick.sel >= 0 && items[state.quick.sel] && !state.busy && !state.quick.importMode) {
      e.preventDefault();
      quickRunItem(items[state.quick.sel]);
    }
  });

  function quickNorm(t) {
    var s = String(t || "");
    if (typeof s.normalize === "function") s = s.normalize("NFKC");
    // カタカナをひらがなに統一して日本語の表記ゆれを吸収
    s = s.replace(/[\u30a1-\u30f6]/g, function(ch) { return String.fromCharCode(ch.charCodeAt(0) - 0x60); });
    return s.toLowerCase().replace(/[\s　]+/g, "");
  }

  function quickScoreToken(item, t) {
    if (!t) return 1;
    var best = 0;
    [item.label, item.name].concat(item.words || []).forEach(function(w) {
      var n = quickNorm(w);
      if (!n) return;
      if (n === t) best = Math.max(best, 100);
      else if (n.indexOf(t) >= 0) best = Math.max(best, 60);
      else if (t.indexOf(n) >= 0 && n.length >= 2) best = Math.max(best, 40 + Math.min(n.length, 20));
    });
    if (!best && item.desc && quickNorm(item.desc).indexOf(t) >= 0) best = 30;
    if (!best && item.steps && item.steps.length && quickNorm(item.steps.join(" ")).indexOf(t) >= 0) best = 25;
    return best;
  }

  function quickScore(item, txt) {
    if (!txt) return 1;
    var raw = String(txt || "").trim();
    var tokens = raw.split(/[\s　]+/).map(quickNorm).filter(Boolean);
    if (!tokens.length) return 1;
    if (tokens.length === 1) return quickScoreToken(item, tokens[0]);
    var total = 0;
    for (var i = 0; i < tokens.length; i++) {
      var sc = quickScoreToken(item, tokens[i]);
      if (!sc) return 0;
      total += sc;
    }
    return Math.round(total / tokens.length) + 10;
  }

  function quickFiltered() {
    var txt = (els.askInput.value || "").trim();
    var f = state.quick.filter || "all";
    var all = quickAllItems().filter(function(it) {
      if (f === "all") return true;
      if (f === "pin") return quickIsPinned(it);
      return it.src === f;
    });
    if (!txt) {
      if (f === "all" && state.quick.pins && Object.keys(state.quick.pins).length) {
        var pinned = all.filter(quickIsPinned);
        var rest = all.filter(function(it) { return !quickIsPinned(it); });
        return pinned.concat(rest);
      }
      return all;
    }
    var srcRank = { sheet: 2, my: 2, shelf: 1 };
    return all.map(function(it, i) { return { it: it, s: quickScore(it, txt), p: quickIsPinned(it) ? 1 : 0, i: i }; })
      .filter(function(x) { return x.s > 0; })
      .sort(function(a, b) { return (b.s - a.s) || (b.p - a.p) || (srcRank[b.it.src] - srcRank[a.it.src]) || (a.i - b.i); })
      .map(function(x) { return x.it; });
  }

  var QUICK_TAG = { sheet: "シート", my: "マイ", shelf: "棚" };

  function renderQuickList() {
    var items = quickFiltered();
    state.quick.items = items;
    els.quickList.innerHTML = "";
    if (!items.length) {
      var empty = document.createElement("div");
      empty.className = "log-empty";
      empty.textContent = state.quick.loaded ? "当たるマクロがありません（実行で頼みとして撃ちます）" : "読込中…";
      els.quickList.appendChild(empty);
    }
    items.forEach(function(it, idx) {
      var row = document.createElement("div");
      row.className = "hist-item quick-item" + (state.quick.sel === idx ? " selected" : "");
      var tag = document.createElement("span");
      tag.className = "quick-tag t-" + it.src;
      tag.textContent = QUICK_TAG[it.src];
      var lab = document.createElement("span");
      lab.className = "quick-label";
      lab.textContent = it.label;
      row.appendChild(tag);
      if (quickIsPinned(it)) {
        var pinMk = document.createElement("span");
        pinMk.className = "quick-pin-mark";
        pinMk.textContent = "★";
        pinMk.title = "ピン留め済み";
        row.appendChild(pinMk);
      }
      if (it.steps && it.steps.length) {
        var bolt = document.createElement("span");
        bolt.className = "quick-bolt";
        bolt.textContent = "⚡";
        bolt.title = "手順つき（直結対応）";
        row.appendChild(bolt);
      }
      row.appendChild(lab);
      // 一覧は 1 行ずつ。説明は指したとき（マウスを載せる）に下の欄と吹き出しに出す
      var tip = quickItemTip(it);
      row.title = tip;
      row.addEventListener("mouseenter", function() { if (!state.quick.importMode) els.quickNote.textContent = tip; });
      // 1 回押せば選ぶ・2 回押せば撃つ（選んでから「実行」でも撃てる）
      row.addEventListener("click", function() {
        if (state.busy) return;
        state.quick.sel = idx;
        if (state.quick.importMode) {
          if (it.src !== "sheet") { els.quickNote.textContent = "写せるのは「シート」の印のマクロだけです"; return; }
          setQuickImportMode(false);
          quickImportItem(it);
          return;
        }
        quickMarkSel(idx);
      });
      row.addEventListener("dblclick", function() {
        if (state.busy || state.quick.importMode) return;
        state.quick.sel = idx;
        quickMarkSel(idx);
        quickRunItem(it);
      });
      if (state.quick.sel === idx) row.appendChild(quickMoveButtons(idx));
      els.quickList.appendChild(row);
    });
    var q = state.quick;
    els.btnQuickImport.disabled = !q.importMode && !(q.sheet || []).length;
    els.btnQuickImport.textContent = q.importMode ? "やめる" : "マイマクロへ";
    els.quickList.style.outline = q.importMode ? "2px solid #16a34a" : "";
    els.btnQuickEdit.textContent = q.myId ? "編集" : "マイマクロを作る";
  }

  // 選んだ印だけを付け替える（一覧を描き直すと、ダブルクリックの 2 回目が別の行に当たって撃てなくなる）
  function quickMarkSel(idx) {
    var rows = els.quickList.querySelectorAll(".quick-item");
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle("selected", i === idx);
      var mv = rows[i].querySelector(".quick-move");
      if (mv && i !== idx) mv.parentNode.removeChild(mv);
      if (i === idx && !mv) rows[i].appendChild(quickMoveButtons(idx));
    }
  }

  // 一覧の選択位置を移して画面内へスクロールし、下の欄に説明を出す（-1 で選択解除）
  function quickSelectIdx(idx) {
    var items = state.quick.items || [];
    if (idx < 0 || idx >= items.length) {
      state.quick.sel = -1;
      quickMarkSel(-1);
      return;
    }
    state.quick.sel = idx;
    quickMarkSel(idx);
    var rows = els.quickList.querySelectorAll(".quick-item");
    var row = rows[idx];
    if (row && row.scrollIntoView) row.scrollIntoView({ block: "nearest" });
    if (!state.quick.importMode) {
      els.quickNote.textContent = quickItemTip(items[idx]);
    }
  }

  var QUICK_LS_KEY = "gasquick_list_v1";
  function quickRestoreList() {
    try {
      var raw = window.localStorage.getItem(QUICK_LS_KEY);
      if (raw) {
        var c = JSON.parse(raw), q = state.quick;
        // シートのマクロはシートごとに違うので覚えから出さない（マイマクロはどのシートでも同じ）
        q.my = c.my || []; q.myId = c.myId || ""; q.myUrl = c.myUrl || ""; q.myStamp = c.myStamp || "";
        if (c.order) { q.order.my = c.order.my || []; q.order.shelf = c.order.shelf || []; }
        if (c.pins && typeof c.pins === "object") q.pins = c.pins;
      }
    } catch (e) {}
    state.quick.loaded = true;
    renderQuickList();
  }

  function quickRememberLocal() {
    var q = state.quick;
    try {
      window.localStorage.setItem(QUICK_LS_KEY, JSON.stringify({ my: q.my || [], myId: q.myId || "", myUrl: q.myUrl || "", myStamp: q.myStamp || "",
        order: { my: q.order.my || [], shelf: q.order.shelf || [] }, pins: q.pins || {} }));
    } catch (e) {}
  }

  function loadQuickList(force) {
    var isForce = force === true || !!state.quick._fetchedOnce;
    callGas("comboQuickList", isForce ? { force: true } : {}, function(res) {
      var q = state.quick;
      q.loaded = true;
      if (res && res.ok) {
        q._fetchedOnce = true;
        q.sheet = res.sheet || [];
        if (res.order) q.order = { sheet: res.order.sheet || [], my: res.order.my || [], shelf: res.order.shelf || [] };
        q.my = res.my || [];
        q.myId = res.myId || "";
        q.myUrl = res.myUrl || "";
        q.myStamp = res.myStamp || "";
        if (typeof res.oauthToken === "string" && res.oauthToken) {
          state.oauthToken = res.oauthToken;
          state.oauthTokenAt = Date.now();
        }
        quickRememberLocal();
        if (res.draft && !els.askInput.value) { els.askInput.value = res.draft; updatePreview(); }
        if (res.build && QUICK_SIDEBAR_BUILD && res.build !== QUICK_SIDEBAR_BUILD) { quickCheckBuild(true); }
        els.quickNote.textContent = res.addonNote ? res.addonNote : res.myError ? ("マイマクロを読めませんでした: " + res.myError)
          : (q.myId ? "" : "「マイマクロを作る」を押すと、どのシートでも使える自分のマクロ置き場ができます");
      }
      renderQuickList();
    }, function(err) {
      state.quick.loaded = true;
      els.quickNote.textContent = "一覧を読めませんでした: " + formatError(err);
      renderQuickList();
    });
  }

  function quickCompileSteps(steps) {
    var kind = (state.target && state.target.kind) || "sheet";
    var baseScope = getActiveScope();
    var ops = [], carry = null;
    for (var i = 0; i < steps.length; i++) {
      var stepTxt = String(steps[i] || "").trim();
      if (!stepTxt) continue;
      var p = null;
      if (carry && !hasSelectionPronoun(stepTxt)) {
        var pCarry = Planner.plan(stepTxt, kind, state.table, state.sheets, state.curSheet, carry);
        if (pCarry && pCarry.fire && Array.isArray(pCarry.ops) && pCarry.ops.length && pCarry.ops[0].shelf === "format") {
          p = pCarry;
        }
      }
      if (!p) {
        p = Planner.plan(stepTxt, kind, state.table, state.sheets, state.curSheet, baseScope);
      }
      if (p && Array.isArray(p.ops) && p.ops.length === 1 && p.ops[0] && p.ops[0].shelf === "width" &&
          !p.ops[0].width && !p.ops[0].cols && !p.ops[0].rows && !p.ops[0].auto &&
          /(?:自動|中身に合|オートフィット)/.test(stepTxt)) {
        var wOp = p.ops[0];
        if (wOp.col) {
          wOp.auto = [wOp.col];
          delete wOp.col;
        } else if (state.table && Array.isArray(state.table.columns)) {
          var allCols = state.table.columns.map(function(c) { return c.col; }).filter(Boolean);
          if (allCols.length) wOp.auto = allCols;
        }
        if (Array.isArray(wOp.auto) && wOp.auto.length && !(p.reasons && p.reasons.length)) {
          p.fire = true;
        }
      }
      if (!p || !p.fire || !Array.isArray(p.ops) || !p.ops.length) {
        var reason = "";
        if (p && p.reasons && p.reasons.length) reason = p.reasons.join("／");
        else if (p && p.missing && p.missing.length) reason = "不足: " + p.missing.join("、");
        return { ok: false, index: i + 1, step: stepTxt, reason: reason };
      }
      for (var j = 0; j < p.ops.length; j++) ops.push(p.ops[j]);
      var lastOp = p.ops[p.ops.length - 1];
      if (lastOp && lastOp.shelf === "format") {
        var nextCarry = {};
        ["header", "title", "range", "col"].forEach(function(k) {
          if (lastOp[k] !== undefined && lastOp[k] !== null && lastOp[k] !== "" && lastOp[k] !== false) nextCarry[k] = lastOp[k];
        });
        carry = Object.keys(nextCarry).length ? nextCarry : null;
      } else {
        carry = null;
      }
    }
    return { ok: true, ops: ops };
  }

  function quickRunSteps(it) {
    var steps = (it && Array.isArray(it.steps)) ? it.steps : [];
    if (!steps.length) return;
    if (state.busy) {
      appendLog(els.chatLog, "is-err", "⚠ 別の処理を実行中です", "完了までお待ちください。");
      return;
    }
    var needLiveSel = steps.some(function(s) { return hasSelectionPronoun(s); });
    if (els.chkSync.checked && needLiveSel && !state.liveSelDone) {
      setBusy(true, "選んでいる所を読んでいます…");
      var again = function() {
        setBusy(false);
        state.liveSelDone = true;
        try { quickRunSteps(it); } finally { state.liveSelDone = false; }
      };
      callGas("comboPollSelection", { targetId: state.target.id || "", sheet: "" },
        function(res) { if (res && res.ok) applyServerState(res); again(); }, again);
      return;
    }
    var label = (it.src === "my" ? "マイマクロ " : "マクロ ") + it.name;
    var compiled = quickCompileSteps(steps);
    if (!compiled.ok) {
      var msg = "手順 " + compiled.index + "「" + compiled.step + "」が棚に当たりません" + (compiled.reason ? "（" + compiled.reason + "）" : "");
      els.quickNote.textContent = "⚠ " + msg;
      appendLog(els.chatLog, "is-err", "[✗ " + label + "]", msg);
      return;
    }
    onRunOps(compiled.ops, label, { switchToChat: false });
  }

  function quickRunItem(it) {
    if (!it) return;
    if (it.src === "shelf") {
      if (it.needArgs) {
        els.askInput.value = it.example || it.label;
        els.askInput.focus();
        if (els.askInput.select) els.askInput.select();
        updatePreview();
        els.quickNote.textContent = it.example
          ? ("例「" + it.example + "」を入力しました。書き換えて Enter で実行できます")
          : ("棚「" + it.label + "」は言葉を足してから実行してください（例: どの列・何色）");
        return;
      }
      onRunOps([{ shelf: it.name }], it.label, { switchToChat: false });
      return;
    }
    if (Array.isArray(it.steps) && it.steps.length) {
      quickRunSteps(it);
      return;
    }
    state.directUndoStack = [];
    runServerAction({
      fnName: "comboQuickRun",
      payload: { src: it.src, name: it.name, myId: state.quick.myId, myStamp: state.quick.myStamp || "", backup: !!els.chkBackup.checked },
      label: (it.src === "my" ? "マイマクロ " : "マクロ ") + it.name,
      statusText: it.name + " を実行中…",
      switchToChat: false,
      onSuccess: function(res, wallMs) {
        var sec = typeof wallMs === "number" ? ("（" + (Math.max(0, wallMs / 1000)).toFixed(2) + "s）") : "";
        els.quickNote.textContent = (res.text || "完了") + sec;
      }
    });
  }

  // 入力欄の Enter: ↑↓やクリックで選んでいればそれを撃つ。選んでいなければ、言葉がシート・マイマクロの先頭に当たるときだけ撃つ（棚は頼みとして撃つ）
  function quickRunFromInput() {
    var items = state.quick.items || [];
    var picked = state.quick.sel >= 0 && !!items[state.quick.sel];
    var it = picked ? items[state.quick.sel] : null;
    var txt = (els.askInput.value || "").trim();
    if (!picked && txt && items.length && items[0].src !== "shelf" && quickScore(items[0], txt) >= 60) it = items[0];
    if (!it) return false;
    if (!picked && it.src === "shelf" && txt) return false;
    if (it.src === "shelf" && it.needArgs) {
      quickRunItem(it);
      return true;
    }
    pushHistory(txt || it.label);
    els.askInput.value = "";
    updatePreview();
    state.quick.sel = -1;
    renderQuickList();
    quickRunItem(it);
    return true;
  }

  function onRunOps(ops, customLabel, opts) {
    var label = customLabel || formatOpsShort(ops) || "ops実行";
    var switchChat = !(opts && opts.switchToChat === false);
    var runViaGas = function() {
      state.directUndoStack = [];
      runServerAction({
        fnName: "comboRunOps",
        payload: {
          ops: ops,
          ok: !!els.chkOk.checked,
          backup: !!els.chkBackup.checked,
          assumeActive: true,
          targetId: state.target.id || "",
          targetName: state.target.name || "",
          sheets: state.sheets || [],
          sheet: state.curSheet || "",
          selection: els.chkSync.checked ? (state.selection || "") : "",
          table: state.table
        },
        label: label,
        statusText: "実行中…",
        switchToChat: switchChat,
        onSuccess: !switchChat ? function(res, wallMs) {
          var firstLine = String((res && res.text) || "").split("\n").filter(function(s) {
            return s && s.indexOf("対象:") !== 0 && s.indexOf("[棚ヒット]") !== 0;
          })[0] || (label + " を実行しました");
          var sec = typeof wallMs === "number" ? ("（" + (Math.max(0, wallMs / 1000)).toFixed(2) + "s）") : "";
          els.quickNote.textContent = firstLine + sec;
        } : undefined
      });
    };
    if (!els.chkBackup.checked && tryDirectSheetsApi(ops, label, false, runViaGas, false, { switchToChat: switchChat })) {
      return;
    }
    runViaGas();
  }

  function onUndo() {
    var undoViaGas = function() {
      runServerAction({
        fnName: "comboUndo",
        payload: {
          ok: !!els.chkOk.checked,
          targetId: state.target.id || "",
          assumeActive: true
        },
        label: "直前を取り消す",
        statusText: "取り消し中…",
        switchToChat: true
      });
    };
    if (tryDirectUndo(undoViaGas)) {
      return;
    }
    undoViaGas();
  }

  function onAutoWidth() {
    var scope = getActiveScope();
    if (els.chkSync.checked && scope && Array.isArray(scope.cols) && scope.cols.length &&
        (scope.col_select || scope.cols.length > 1)) {
      onRunOps([{ shelf: "width", auto: scope.cols }], "列幅自動");
      return;
    }
    var cols = (state.table && Array.isArray(state.table.columns))
      ? state.table.columns.map(function(c) { return c.col; }).filter(Boolean)
      : [];
    if (cols.length) {
      onRunOps([{ shelf: "width", auto: cols }], "列幅自動");
      return;
    }
    runServerAction({
      fnName: "comboRunAsk",
      payload: {
        ask: "全ての列の幅を中身に合わせて",
        ok: !!els.chkOk.checked,
        backup: !!els.chkBackup.checked,
        targetId: state.target.id || "",
        targetName: state.target.name || "",
        sheets: state.sheets || [],
        sheet: state.curSheet || "",
        selection: els.chkSync.checked ? (state.selection || "") : "",
        table: state.table
      },
      label: "列幅自動",
      statusText: "実行中…",
      switchToChat: true
    });
  }

  function onFreezeHeader() {
    var hr = (state.table && state.table.header_row) ? state.table.header_row : 1;
    onRunOps([{ shelf: "freeze", rows: hr }], "見出し固定");
  }

  function onFindShelf() {
    var txt = (els.askInput.value || "").trim();
    var kind = (state.target && state.target.kind) || "sheet";
    if (typeof Planner.ask === "function") {
      var t0 = performance.now();
      var resText = String(Planner.ask(txt, kind) || "");
      var elapsed = performance.now() - t0;
      recordExecution(true, "棚検索: " + (txt || "一覧") + " (ローカル0ms)", resText, elapsed, 0, true);
      return;
    }
    runServerAction({
      fnName: "comboFind",
      payload: { ask: txt, kind: kind },
      label: "棚検索: " + (txt || "一覧"),
      statusText: "棚検索中…",
      switchToChat: true
    });
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function() {
        return fallbackCopy(text);
      });
    }
    return fallbackCopy(text);
  }

  function fallbackCopy(text) {
    return new Promise(function(resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) resolve();
        else reject(new Error("コピーに失敗しました"));
      } catch (e) {
        reject(e);
      }
    });
  }

  // ---- キーボード操作（Enter実行・Shift+Enter改行・上下履歴） ----
  function getCursorLineInfo(ta) {
    var val = ta.value || "";
    var pos = ta.selectionStart || 0;
    var before = val.slice(0, pos);
    var lineIdx = before.split("\n").length - 1;
    var totalLines = val.split("\n").length;
    return { lineIdx: lineIdx, totalLines: totalLines };
  }

  els.askInput.addEventListener("keydown", function(e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (state.activeTab === "list" && quickRunFromInput()) return;
      onRunAsk();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var listItems = (state.activeTab === "list") ? (state.quick.items || []) : [];
    if (e.key === "Escape" && listItems.length && state.quick.sel >= 0) {
      e.preventDefault();
      quickSelectIdx(-1);
      return;
    }
    if (e.key === "ArrowUp") {
      var infoUp = getCursorLineInfo(els.askInput);
      if (infoUp.lineIdx === 0) {
        if (listItems.length && state.quick.sel >= 0) {
          e.preventDefault();
          quickSelectIdx(state.quick.sel - 1);
          return;
        }
        if (state.history.length > 0) {
          e.preventDefault();
          if (state.histIdx < 0 || state.histIdx > state.history.length) {
            state.histIdx = state.history.length;
          }
          state.histIdx = Math.max(0, state.histIdx - 1);
          els.askInput.value = state.history[state.histIdx] || "";
          updatePreview();
        }
      }
      return;
    }
    if (e.key === "ArrowDown") {
      var infoDown = getCursorLineInfo(els.askInput);
      if (infoDown.lineIdx === infoDown.totalLines - 1) {
        if (listItems.length) {
          e.preventDefault();
          quickSelectIdx(state.quick.sel < 0 ? 0 : Math.min(listItems.length - 1, state.quick.sel + 1));
          return;
        }
        if (state.history.length > 0) {
          e.preventDefault();
          state.histIdx = Math.min(state.history.length, state.histIdx + 1);
          els.askInput.value = (state.histIdx >= state.history.length) ? "" : (state.history[state.histIdx] || "");
          updatePreview();
        }
      }
    }
  });

  els.askInput.addEventListener("input", updatePreview);
  els.askInput.addEventListener("input", function() { state.quick.sel = -1; renderQuickList(); });
  els.askInput.addEventListener("keyup", updatePreview);

  // ---- ボタン・イベント配線 ----
  els.btnRun.addEventListener("click", function() {
    if (state.activeTab === "list" && quickRunFromInput()) return;
    onRunAsk();
  });
  els.btnClear.addEventListener("click", function() {
    els.askInput.value = "";
    updatePreview();
    els.askInput.focus();
  });

  els.chkSync.addEventListener("change", function() {
    updateSelectionLabel();
    updatePreview();
  });
  els.chkBackup.addEventListener("change", function() {
    var on = !!els.chkBackup.checked;
    state.config.backupDefault = on;
    if (hasGasBridge()) {
      callGas("comboSaveConfig", { backupDefault: on }, function() {}, function() {});
    }
    setStatus("控え: " + (on ? "ON" : "OFF"), false);
  });

  els.sheetSelect.addEventListener("change", function() {
    onLook(els.sheetSelect.value);
  });
  els.settingsSheetSelect.addEventListener("change", function() {
    onLook(els.settingsSheetSelect.value);
  });
  els.btnLook.addEventListener("click", function() { onLook(); });
  els.btnRefresh.addEventListener("click", function() { onInit(true); });

  var tabBtns = document.querySelectorAll(".tab-btn");
  for (var t = 0; t < tabBtns.length; t++) {
    tabBtns[t].addEventListener("click", function() {
      switchTab(this.getAttribute("data-tab"));
    });
  }

  els.btnSeiri.addEventListener("click", function() {
    onRunOps([{ shelf: "seiri" }], "【一発整形】データ整理 ＋ 表を整える");
  });
  els.btnDocStyle.addEventListener("click", function() {
    onRunOps([{ shelf: "doc.style" }], "【一発整形】文書の体裁を整える");
  });

  var quickBtns = document.querySelectorAll("#pane-auto .quick-grid .btn");
  for (var q = 0; q < quickBtns.length; q++) {
    quickBtns[q].addEventListener("click", function() {
      var opRaw = this.getAttribute("data-op");
      var action = this.getAttribute("data-action");
      var btnText = this.textContent.trim();
      if (opRaw) {
        try {
          onRunOps(JSON.parse(opRaw), btnText);
        } catch (e) {
          appendLog(els.chatLog, "is-err", "[✗ 操作解析エラー]", formatError(e));
        }
      } else if (action === "look") {
        onLook();
      } else if (action === "undo") {
        onUndo();
      } else if (action === "autoWidth") {
        onAutoWidth();
      } else if (action === "freezeHeader") {
        onFreezeHeader();
      } else if (action === "findShelf") {
        onFindShelf();
      }
    });
  }

  function flashBtn(b, t, label) { b.textContent = t; setTimeout(function() { b.textContent = label; }, 1500); }

  els.btnAgain.addEventListener("click", function() {
    var last = state.history.length ? state.history[state.history.length - 1] : "";
    if (!last) { flashBtn(els.btnAgain, "頼みがありません", "もう一度"); return; }
    els.askInput.value = last;
    onRunAsk();
  });

  // 直した所へ移る: シートの名前ボックスに番地を入れる（Chrome の拡張のサイドパネルで開いているとき）
  els.btnGoChanged.addEventListener("click", function() {
    var a1 = state.lastChanged || "";
    if (!a1) { flashBtn(els.btnGoChanged, "まだありません", "直した所"); return; }
    var bang = a1.lastIndexOf("!");
    if (bang > 0) {
      var sh = a1.slice(0, bang).replace(/^'|'$/g, "");
      a1 = "'" + sh.replace(/'/g, "''") + "'!" + a1.slice(bang + 1);
    }
    state.gotoWait = setTimeout(function() {
      state.gotoWait = null;
      flashBtn(els.btnGoChanged, "移れません", "直した所");
      appendLog(els.traceLog, "is-err", "[直した所] " + a1, "拡張から返事がありません（Chrome 拡張のサイドパネルで開いているときだけ効きます。拡張を chrome://extensions で再読み込み）");
    }, 1500);
    try { window.top.postMessage({ type: "GAS_COMBO_GOTO", range: a1 }, "*"); } catch (e) {}
  });
  window.addEventListener("message", function(ev) {
    var d = ev && ev.data;
    if (!d || d.type !== "GAS_COMBO_GOTO_DONE") return;
    if (state.gotoWait) { clearTimeout(state.gotoWait); state.gotoWait = null; }
    flashBtn(els.btnGoChanged, d.ok ? "移りました" : "移れません", "直した所");
    if (!d.ok) appendLog(els.traceLog, "is-err", "[直した所] 移れません", String(d.why || ""));
  });

  els.btnCopyLog.addEventListener("click", function() {
    var b = els.btnCopyLog, label = "会話をコピー";
    var txt = els.chatLog.querySelector(".log-empty") ? "" : String(els.chatLog.innerText || "").trim();
    function flash(t) { b.textContent = t; setTimeout(function() { b.textContent = label; }, 1500); }
    if (!txt) { flash("会話がありません"); return; }
    copyToClipboard(txt).then(function() { flash("コピーしました"); })
      .catch(function(err) { flash("コピー失敗"); });
  });

  els.btnClearLog.addEventListener("click", function() {
    clearLogBox(els.chatLog, "実行結果がここに表示されます。");
  });

  els.btnUseHist.addEventListener("click", function() {
    if (state.selectedHistIdx >= 0 && state.history[state.selectedHistIdx] !== undefined) {
      els.askInput.value = state.history[state.selectedHistIdx];
      updatePreview();
      els.askInput.focus();
    }
  });
  els.btnSaveSteps.addEventListener("click", function() {
    var picked = [];
    for (var hi = 0; hi < state.history.length; hi++) {
      if (state.checkedHist[hi]) picked.push(state.history[hi]);
    }
    if (!picked.length && state.selectedHistIdx >= 0 && state.history[state.selectedHistIdx]) {
      picked.push(state.history[state.selectedHistIdx]);
    }
    if (!picked.length && (els.askInput.value || "").trim()) {
      picked.push((els.askInput.value || "").trim());
    }
    if (!picked.length) {
      flashBtn(els.btnSaveSteps, "履歴を選択", "⚡手順化");
      return;
    }
    var defName = "手順_" + picked[0].slice(0, 12);
    var name = window.prompt("マイマクロに保存する名前を入力してください\n手順(" + picked.length + "件): " + picked.join(" / "), defName);
    if (!name || !name.trim()) return;
    runServerAction({
      fnName: "comboQuickSaveSteps",
      payload: { name: name.trim(), steps: picked },
      label: "⚡手順マクロ保存: " + name.trim(),
      statusText: "手順マクロを保存中…",
      switchToChat: false,
      onSuccess: function(res) {
        state.checkedHist = {};
        renderHistory();
        els.quickNote.textContent = (res && res.text) || "手順マクロを保存しました";
        loadQuickList(true);
        switchTab("list");
      }
    });
  });
  els.btnRerunHist.addEventListener("click", function() {
    if (state.selectedHistIdx >= 0 && state.history[state.selectedHistIdx] !== undefined) {
      els.askInput.value = state.history[state.selectedHistIdx];
      updatePreview();
      onRunAsk();
    }
  });

  els.btnNewTalk.addEventListener("click", function() {
    els.askInput.value = "";
    updatePreview();
    clearLogBox(els.chatLog, "実行結果がここに表示されます。");
    switchTab("auto");
    els.askInput.focus();
  });
  els.btnUndo.addEventListener("click", onUndo);
  els.btnQuickRun.addEventListener("click", function() {
    var it = state.quick.items[state.quick.sel];
    if (it) { quickRunItem(it); return; }
    if (!quickRunFromInput() && (els.askInput.value || "").trim()) onRunAsk();
  });
  els.btnQuickReload.addEventListener("click", function() { loadQuickList(); });
  els.btnQuickEdit.addEventListener("click", function() {
    var q = state.quick, it = q.items[q.sel];
    if (it && it.src === "sheet") {
      els.quickNote.textContent = "シートのマクロは メニューの「拡張機能 → Apps Script」で開いて直してください";
      return;
    }
    if (q.myUrl) { window.open(q.myUrl, "_blank"); return; }
    runServerAction({
      fnName: "comboQuickMake", payload: {}, label: "マイマクロを作る", statusText: "マイマクロを作っています…", switchToChat: false,
      onSuccess: function(res) {
        q.myId = res.myId || ""; q.myUrl = res.myUrl || "";
        els.quickNote.textContent = (res.text || "") + "。「編集」で開いて、エディタの Gemini に作ってもらえます";
        loadQuickList();
      }
    });
  });
  // 「マイマクロへ」を押す → 写したいシートのマクロを押す（撃たずに写す）。もう一度押すとやめる
  function setQuickImportMode(on) {
    state.quick.importMode = !!on;
    els.quickNote.textContent = on ? "マイマクロへ写したい「シート」のマクロを押してください（撃ちません）" : "";
    renderQuickList();
  }
  els.btnQuickImport.addEventListener("click", function() { setQuickImportMode(!state.quick.importMode); });
  function quickImportItem(it) {
    runServerAction({
      fnName: "comboQuickImport", payload: { name: it.name }, label: "マイマクロへ " + it.name, statusText: "マイマクロへ写しています…", switchToChat: false,
      onSuccess: function(res) { els.quickNote.textContent = res.text || "写しました"; loadQuickList(); }
    });
  }
  els.btnReload.addEventListener("click", function() { onInit(true); });

  if (els.quickFilterBar) {
    var qfBtns = els.quickFilterBar.querySelectorAll(".quick-filter-btn");
    for (var qfi = 0; qfi < qfBtns.length; qfi++) {
      qfBtns[qfi].addEventListener("click", function() {
        var f = this.getAttribute("data-qfilter") || "all";
        state.quick.filter = f;
        state.quick.sel = -1;
        for (var j = 0; j < qfBtns.length; j++) {
          qfBtns[j].classList.toggle("active", qfBtns[j].getAttribute("data-qfilter") === f);
        }
        renderQuickList();
      });
    }
  }

  // ---- 初期起動 ----
  loadHistoryLocal();
  renderHistory();
  if (els.settingsBuildLabel) {
    els.settingsBuildLabel.textContent = "版: " + (QUICK_SIDEBAR_BUILD || "ローカル");
  }
  if (hasGasBridge()) {
    quickRestoreList();
    loadQuickList();
    runServerAction({
      fnName: "comboInit",
      payload: { targetId: "", sheet: "", assumeActive: true },
      label: "初期化 / 再読込",
      statusText: "読込中…",
      switchToChat: false,
      silentSuccess: true,
      onSuccess: function(res) {
        if (!res || !res.learned) loadLearned();
        if (!res.config) {
          callGas("comboGetConfig", undefined, function(cfg) { applyConfig(cfg); });
        }
      }
    });
  } else {
    els.targetNameLabel.textContent = "プレビュー";
    els.infoLabel.textContent = "対象: GAS サイドバー環境で自動接続されます";
    updateSelectionLabel();
    updatePreview();
  }
  if (typeof globalThis !== "undefined") {
    globalThis.__comboDirectTest = {
      state: state,
      els: els,
      buildDirectBatchUpdate: buildDirectBatchUpdate
    };
  }
})();
</script>
</body>
</html>
